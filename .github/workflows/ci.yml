name: CI

on:
  push:
    branches: [main]
    # Tags, so version-guard's real check can fire on the tag itself; without
    # this the job would only ever run its own fixtures and never see a live
    # tag.
    #
    # Deliberately '*' and not 'v*'. The filter is the real gate on which tags
    # get checked, and a 'v*' filter means `git tag 1.1.0` runs NO workflow at
    # all — the guard silently absent at exactly the moment it exists for, with
    # no red build to show it. Matching every tag lets version-check.sh's own
    # shape check reject a non-`v` tag loudly instead.
    #
    # NOTE: every job in this file now also runs on tag pushes, against the
    # detached HEAD `actions/checkout` produces. All of them are ref-agnostic today
    # (ref-check.sh reads the git index; the leak blocklist secret is available
    # on same-repo tag pushes). Anything added later that assumes a branch —
    # `github.ref_name` used as a branch name, a docs deploy, a `contents:
    # write` step — must account for that.
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  leak-check:
    name: Leak guard (no private strings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep tracked files against the private blocklist
        env:
          # One extended regex per line. Lives in repo settings, NOT in the
          # tree — the blocklist names exactly what must never appear here.
          # Absent on forks/PRs without secrets: the job skips (fail-open for
          # outsiders; the owner's pushes are the vector that matters).
          BLOCKLIST: ${{ secrets.LEAK_BLOCKLIST }}
        run: |
          if [ -z "$BLOCKLIST" ]; then
            echo "::notice::LEAK_BLOCKLIST secret not set - leak guard skipped. Set it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          printf '%s\n' "$BLOCKLIST" > "$RUNNER_TEMP/blocklist.txt"
          bash scripts/leak-check.sh "$RUNNER_TEMP/blocklist.txt"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck install.sh scripts/leak-check.sh scripts/run-stats.sh scripts/ref-check.sh scripts/version-check.sh scripts/settings-drift.sh

  run-stats:
    name: run-stats.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the canonical format fixture
        run: |
          # docs/ is gitignored, so CI never has real plan files. The tracked
          # example doubles as the fixture: if its keys drift from the parser,
          # this fails instead of the drift going unnoticed. Use a dedicated
          # directory — never $RUNNER_TEMP itself, which holds the leak
          # blocklist in the job above.
          fixture="$RUNNER_TEMP/plans-fixture"
          mkdir -p "$fixture"
          cp scripts/run-stats.example.md "$fixture/"
          # Which awk ran is part of the evidence: the parser is only ever
          # exercised on this runner's default, and mawk vs gawk differences
          # (see the CRLF fixture below) are exactly what a bare green hides.
          { awk -W version 2>/dev/null </dev/null || awk --version </dev/null; } | head -1 || true
          # stderr is captured apart from stdout: any warning at all (near-miss
          # heading, unclosed fence, second block) means the example drifted.
          out=$(bash scripts/run-stats.sh "$fixture" 2>"$RUNNER_TEMP/rs-canonical.err")
          err=$(cat "$RUNNER_TEMP/rs-canonical.err")
          echo "$out"
          # Assert computed values, not boilerplate: a key rename in either the
          # fixture or the parser changes these numbers or trips a warning.
          echo "$out" | grep -q '^Ratios over 1 complete run(s)\.$' \
            || { echo "::error::fixture did not yield one complete run"; exit 1; }
          echo "$out" | grep -q '^Actioned findings + escapes: 14 ' \
            || { echo "::error::arithmetic changed — expected a denominator of 14"; exit 1; }
          echo "$out" | grep -q 'escaped both passes      7.1%' \
            || { echo "::error::escape rate changed — expected 7.1%"; exit 1; }
          # The fix-loop tally is computed from the example's own gates_failed, so
          # a rename of that key, or a parser that stops reading it, goes red. The
          # tally line sits under the table, before the ratios, so it does not
          # disturb the last-line check below.
          gf=$(sed -n 's/^gates_failed: *//p' scripts/run-stats.example.md | tr -d '[] \r')
          want="runs with a fix loop, by gate (1 runs with gates_failed):"
          for g in 1 2 3 4 5; do
            c=0; case ",$gf," in *",$g,"*) c=1 ;; esac
            want="$want G$g $c"; [ "$g" = 5 ] || want="$want ·"
          done
          echo "$out" | grep -qF -- "$want" \
            || { echo "::error::gate tally changed — expected: $want"; exit 1; }
          # Two checks that do not depend on any message's wording. The example
          # must be warning-free (stderr empty), and nothing may print after the
          # last ratio line: diagnostics() and the listings come after it, so if
          # a counter, a skipped block, an unfilled section or a duplicate ever
          # shows up, the last non-empty line is no longer the "dropped" line.
          # Print what is there, so the failure says which.
          last=$(printf '%s\n' "$out" | grep -v '^$' | tail -1)
          case $last in
            *'dropped without individual reasons'*) ;;
            *) printf '%s\n' "$out" | tail -5 | sed 's/^/::error::example produced a trailing diagnostic: /'; exit 1 ;;
          esac
          if [ -n "$err" ]; then
            printf '%s\n' "$err" | sed 's/^/::error::example produced a warning: /'; exit 1
          fi
      - name: Handle the empty case without dying
        run: |
          empty="$RUNNER_TEMP/plans-empty"
          mkdir -p "$empty"
          bash scripts/run-stats.sh "$empty" | grep -q 'nothing to aggregate' \
            || { echo "::error::empty directory not handled"; exit 1; }
      - name: Prove every parser path can fail, one fixture each
        run: |
          # Same house rule as the ref-check job: each fixture asserts the
          # message of THE path it exercises, never just an exit status, and each
          # was verified by mutation (neuter the guard in a copy of the script;
          # the fixture must go red with its own error). The parser always exits
          # 0, so the message is the only thing there is to assert on.
          fx="$RUNNER_TEMP/rs-fixture"
          rs="$PWD/scripts/run-stats.sh"

          fresh() { rm -rf "$fx"; mkdir -p "$fx"; }

          # A complete block: $1 = date, $2 = slug.
          block() {
            printf '```yaml\ndate: %s\nslug: %s\ngear: full\neffort_plan: high\neffort_diff: high\n' "$1" "$2"
            printf 'findings_plan_actioned: 1\nfindings_plan_rejected: 0\nfindings_plan_dropped: 0\n'
            printf 'findings_diff_actioned: 1\nfindings_diff_rejected: 0\nfindings_diff_dropped: 0\n'
            printf 'escaped: 0\nagents_spawned: 3\ngates_failed_first_pass: none\nescalated_from: none\n```\n'
          }

          # A block whose gates line is replaced: $1 = date, $2 = slug, $3 = the
          # line to write where block() puts the legacy gates_failed_first_pass.
          gblock() { block "$1" "$2" | sed "s/^gates_failed_first_pass: none\$/$3/"; }

          # stdout + stderr, from inside the fixture dir; args default to the dir
          # itself (absolute, so listings read $fx/...). Callers on the exit-1
          # paths add || true.
          run() { out=$(cd "$fx" && bash "$rs" "${@:-$fx}" 2>&1 </dev/null); }

          # A "## Run stats" heading to start a plan; the same block cut off before
          # its closing fence; the assertion for a single counted run.
          head_run() { printf '# P\n\n## Run stats\n\n'; }
          open_block() { block "$@" | sed '$d'; }
          one_run() { expect 'Ratios over 1 complete run(s).' "$1"; }

          # The assertions record a failure and carry on, so a broken parser (or a
          # mutant) shows EVERY fixture it breaks in one run; the step exits
          # non-zero once, at the end.
          fail=0
          red() { echo "::error::$1"; printf '%s\n' "$out" | cat -v; fail=1; }

          # $1 = fixed string that must appear, $2 = label
          expect() {
            if printf '%s\n' "$out" | grep -qF -- "$1"; then echo "  ok - $2"
            else red "$2: expected message not found: $1"; fi
          }
          # $1 = fixed string that must NOT appear, $2 = label
          refute() {
            if printf '%s\n' "$out" | grep -qF -- "$1"; then red "$2: unexpected output present: $1"; fi
          }
          # $1 = raw byte sequence (printf escapes) that must NOT appear anywhere.
          refute_bytes() {
            if printf '%s' "$out" | grep -qF -- "$(printf "$1")"; then red "$2: raw control bytes reached the output"; fi
          }

          # 1 - suffixed heading parses, "Run statsheet" does not, and two
          # blocks with one (date, slug) but different values in ONE file are
          # two runs, not a duplicate.
          fresh; cp scripts/run-stats.example.md "$fx/plan.md"
          { printf '\n## Run stats — phase 2\n\n'; block 2026-07-25 opus-5-adoption
            printf '\n## Run statsheet\n\n'; block 2026-07-26 not-a-stats-heading; } >> "$fx/plan.md"
          run
          expect 'Ratios over 2 complete run(s).' 'fixture 1 (suffixed heading in, "Run statsheet" out)'
          refute 'duplicate block' 'fixture 1 (same-file repeat with new values is not a duplicate)'
          refute 'pair(s) appear' 'fixture 1 (same-file repeat is not a cross-file collision)'

          # 2 - a duplicate is a block with identical values, in another file
          # too. The same date and slug with different values is two plans that
          # happen to share a name, not a duplicate.
          fresh
          { printf '# A\n\n## Run stats\n\n'; block 2026-08-01 copied-plan; } > "$fx/a.md"
          { printf '# B\n\n## Run stats\n\n'; block 2026-08-01 copied-plan; } > "$fx/b.md"
          run
          expect '1 duplicate block(s) (identical values)' 'fixture 2 (cross-file identical copy)'
          { printf '# B\n\n## Run stats\n\n'; block 2026-08-01 copied-plan | sed 's/^agents_spawned: 3$/agents_spawned: 4/'; } > "$fx/b.md"
          run
          refute 'duplicate block' 'fixture 2 (same date and slug, different values, is not a duplicate)'

          # 3 - the same block pasted twice in one file is a duplicate.
          fresh
          { printf '# A\n\n## Run stats\n\n'; block 2026-08-01 pasted
            printf '\n## Run stats — again\n\n'; block 2026-08-01 pasted; } > "$fx/a.md"
          run
          expect '1 duplicate block(s) (identical values)' 'fixture 3 (same-file identical paste)'

          # 4 - one directory, three spellings, is counted once.
          fresh
          { printf '# A\n\n## Run stats\n\n'; block 2026-08-01 only-once; } > "$fx/a.md"
          run "$fx" "$fx/" .
          one_run 'fixture 4 (directory spelled three ways is deduped)'

          # 5 - a plain relative path (not assignment-shaped) still parses.
          fresh; mkdir -p "$fx/sub/dir"
          { printf '# A\n\n## Run stats\n\n'; block 2026-08-01 relative-path; } > "$fx/sub/dir/p.md"
          run sub/dir
          one_run 'fixture 5 (relative sub/dir parses)'

          # 6 - CDPATH must not defeat the directory dedupe: with CDPATH=. a bare
          # `cd plans` prints the path and would canonicalise differently.
          fresh; mkdir -p "$fx/plans"
          { printf '# A\n\n## Run stats\n\n'; block 2026-08-01 cdpath; } > "$fx/plans/p.md"
          out=$(cd "$fx" && CDPATH=. bash "$rs" plans ./plans 2>&1 </dev/null)
          one_run 'fixture 6 (CDPATH does not split one directory in two)'

          # 7 - near-miss headings are warned about, each case on its own; an
          # H1 title is not. (Two spaces and the right case is a heading: 34.)
          fresh
          printf '# Run stats\n\n## run stats\n\n  ## Run Stats\n\n### Run stats\n' > "$fx/near.md"
          run
          expect "heading not parsed (expected \"## Run stats\"): $fx/near.md:3" 'fixture 7 (lower-case near miss)'
          expect "heading not parsed (expected \"## Run stats\"): $fx/near.md:5" 'fixture 7 (indented, mis-cased near miss)'
          expect "heading not parsed (expected \"## Run stats\"): $fx/near.md:7" 'fixture 7 (### near miss)'
          refute "$fx/near.md:1" 'fixture 7 (H1 must not warn)'

          # 8 - a near miss quoted inside a fence is text, not a heading.
          fresh
          printf '# P\n\n## Notes\n\n```markdown\n## run stats\n### Run stats\n```\n' > "$fx/quoted.md"
          run
          refute 'heading not parsed' 'fixture 8 (no near-miss warning inside a fence)'

          # 9 - a ### Run stats INSIDE an accepted section is a sub-heading.
          fresh
          { printf '# P\n\n## Run stats\n\n### Run stats\n\n'; block 2026-08-02 sub-run-stats; } > "$fx/subrs.md"
          run
          refute 'heading not parsed' 'fixture 9 (### inside a section does not warn)'
          one_run 'fixture 9 (block under it still parses)'

          # 10 - unfilled and malformed are listed by file:line. The complete
          # file sorts FIRST, so a stale "a fence was seen" flag would turn the
          # placeholder into a malformed block; and the placeholder ends at EOF,
          # so it is only attributed to its own file if bfile is captured.
          fresh
          { printf '# A\n\n## Run stats\n\n'; block 2026-08-01 complete-run; } > "$fx/a.md"
          printf '# B\n\n## Run stats\n\n_To be filled in._\n' > "$fx/b.md"
          printf '# C\n\n## Run stats\n\n```yaml\nTBD\n```\n' > "$fx/c.md"
          run
          expect '1 stats section(s) never filled in:' 'fixture 10 (unfilled count)'
          expect "  $fx/b.md:3" 'fixture 10 (unfilled section named by its own file)'
          refute "$fx/a.md:" 'fixture 10 (complete file must not be listed)'
          expect '1 malformed block(s) (fence with no recognised key):' 'fixture 10 (malformed count)'
          expect "  $fx/c.md:3" 'fixture 10 (malformed block listed by file)'

          # 11 - a corpus of only placeholders still lists them (n == 0 path).
          fresh
          printf '# A\n\n## Run stats\n\n_To be filled in._\n' > "$fx/a.md"
          run
          expect 'run-stats: no run-stats blocks found.' 'fixture 11 (empty-corpus message)'
          expect 'never filled in:' 'fixture 11 (placeholders listed when nothing parsed)'
          expect "  $fx/a.md:3" 'fixture 11 (placeholder named)'

          # 12 - a sub-heading inside the section does not cut the block off.
          fresh
          { printf '# P\n\n## Run stats\n\n### Phase 1\n\n'; block 2026-08-02 sub-heading; } > "$fx/sub.md"
          run
          one_run 'fixture 12 (block under a ### sub-heading parses)'

          # 13 - an H2 ends the section: a fence under the NEXT heading is not
          # this section's block.
          fresh
          { printf '# P\n\n## Run stats\n\n_todo_\n\n## Notes\n\n'; block 2026-08-02 under-notes; } > "$fx/h2.md"
          run
          expect 'never filled in' 'fixture 13 (section ended at the H2)'
          refute 'malformed block(s) (' 'fixture 13 (later fence is not this block)'

          # 14 - an unclosed stats fence followed by an accepted stats heading:
          # the heading proves the fence never closed. The retry's BARE fence
          # would otherwise close the first fence and count its partial block.
          fresh
          { head_run; open_block 2026-08-03 first-try
            printf '\n## Run stats — retry\n\nnotes\n\n'; block 2026-08-04 retry-run | sed '1s/.*/```/'; } > "$fx/open.md"
          run
          expect "run-stats: unclosed fence: $fx/open.md:5" 'fixture 14 (stats heading proves the fence never closed)'
          expect 'retry-run' 'fixture 14 (the retry block is the one counted)'
          refute 'first-try' 'fixture 14 (partial block not counted)'

          # 15 - same, but the evidence is a fence line carrying an info string
          # (no heading at all): the bash fence's closer would otherwise close the
          # stats fence and count the partial block.
          fresh
          { head_run; open_block 2026-08-03 never-closed
            printf '\n```bash\necho hi\n```\n'; } > "$fx/info.md"
          run
          expect "run-stats: unclosed fence: $fx/info.md:5" 'fixture 15 (info-string fence proves the fence never closed)'
          refute 'Ratios over' 'fixture 15 (partial block not counted)'
          expect "  $fx/info.md:3" 'fixture 15 (listed as malformed)'

          # 16 - a "## note" line inside a closed block is a YAML comment, not
          # evidence of an unclosed fence.
          fresh
          { head_run; block 2026-08-05 yaml-comment | sed '3i## note'; } > "$fx/c2.md"
          run
          one_run 'fixture 16 (## comment inside a block parses)'
          refute 'unclosed fence' 'fixture 16 (## comment is not evidence)'

          # 17 - a "# note" comment in the middle of a block is skipped quietly.
          fresh
          { head_run; block 2026-08-05 hash-comment | sed '8i# note'; } > "$fx/c1.md"
          run
          one_run 'fixture 17 (# comment inside a block parses)'
          refute 'unparsable' 'fixture 17 (comment is not an unparsable line)'

          # 18 - a heading quoted inside an ordinary fence is not a heading.
          fresh
          { printf '# P\n\n## Approach\n\n```markdown\n## Run stats — phase 2\n```\n\n## Run stats\n\n'
            block 2026-08-04 real-one; } > "$fx/q.md"
          run
          one_run 'fixture 18 (quoted heading ignored, real block parsed)'
          refute 'never filled in' 'fixture 18 (quoted heading did not open a section)'

          # 19 - a non-yaml fence under the stats heading is ordinary code; the
          # yaml block after it is the stats block.
          fresh
          { printf '# P\n\n## Run stats\n\n```markdown\ndate: 2000-01-01\nslug: quoted-example\n```\n\n'
            block 2026-08-05 after-markdown; } > "$fx/md.md"
          run
          one_run 'fixture 19 (yaml block after a markdown fence parses)'
          refute 'quoted-example' 'fixture 19 (the quoted markdown is not parsed)'
          refute 'malformed block(s) (' 'fixture 19 (markdown fence is not a malformed block)'

          # 20 - a closer must be bare: a ```bash line inside a markdown fence
          # does not close it, so the heading after it is a real heading.
          fresh
          { printf '# P\n\n```markdown\n```bash\necho hi\n```\n\n## Run stats\n\n'
            block 2026-08-05 after-bash-line; } > "$fx/bare.md"
          run
          one_run 'fixture 20 (info-string line does not close a fence)'
          refute 'unclosed fence' 'fixture 20 (no unclosed-fence warning)'

          # 21 - one block per heading: a second yaml fence is warned about and
          # not parsed.
          fresh
          { head_run; block 2026-08-06 first-block
            printf '\n'; block 2026-08-07 second-block; } > "$fx/two.md"
          run
          l2=$(grep -n '^```yaml' "$fx/two.md" | sed -n 2p | cut -d: -f1)
          expect 'second block under one heading (use "## Run stats — <label>"): '"$fx/two.md:$l2" 'fixture 21 (second block warned)'
          one_run 'fixture 21 (second block not parsed)'

          # 22 - a keyless placeholder fence does not take the heading's slot: the
          # real block after it counts, with no second-block warning.
          fresh
          { printf '# P\n\n## Run stats\n\n```yaml\nTBD\n```\n\n'; block 2026-08-06 after-placeholder; } > "$fx/ph.md"
          run
          one_run 'fixture 22 (real block after a placeholder fence counts)'
          refute 'second block' 'fixture 22 (placeholder did not use up the slot)'

          # 23 - a longer outer fence can quote a shorter one.
          fresh
          { printf '# P\n\n## Approach\n\n````markdown\n```yaml\nnot: a block\n```\n````\n\n## Run stats\n\n'
            block 2026-08-08 after-nested; } > "$fx/nested.md"
          run
          one_run 'fixture 23 (block after a nested fence parses)'
          refute 'unclosed fence' 'fixture 23 (nested fence closes on its own length)'

          # 24 - an unclosed stats fence is discarded at a file boundary, and
          # does not take the next file with it.
          fresh
          { printf '# A\n\n## Run stats\n\n'; open_block 2026-08-03 never-closed; } > "$fx/a-open.md"
          { printf '# B\n\n## Run stats\n\n'; block 2026-08-04 after-open; } > "$fx/b-ok.md"
          run
          expect "run-stats: unclosed fence: $fx/a-open.md:5" 'fixture 24 (unclosed fence names its opening line)'
          one_run 'fixture 24 (partial block not counted, later file parses)'
          expect "  $fx/a-open.md:3" 'fixture 24 (partial block listed as malformed)'

          # 25 - an unclosed ORDINARY fence inside a stats section is a malformed
          # section, not an unfilled one; the next file is unaffected.
          fresh
          printf '# A\n\n## Run stats\n\n```bash\necho never closed\n' > "$fx/a-bash.md"
          { printf '# B\n\n## Run stats\n\n'; block 2026-08-04 after-bash; } > "$fx/b-ok.md"
          run
          expect "run-stats: unclosed fence: $fx/a-bash.md:5" 'fixture 25 (unclosed bash fence warned)'
          expect "  $fx/a-bash.md:3" 'fixture 25 (listed as malformed)'
          refute 'never filled in' 'fixture 25 (not reported as unfilled)'
          one_run 'fixture 25 (later file parses)'

          # 26 - same at EOF of the LAST file (nothing follows to hide behind).
          fresh
          { printf '# B\n\n## Run stats\n\n'; block 2026-08-04 fine; } > "$fx/b-ok.md"
          { printf '# Z\n\n## Run stats\n\n'; open_block 2026-08-09 eof-open; } > "$fx/z-open.md"
          run
          expect "run-stats: unclosed fence: $fx/z-open.md:5" 'fixture 26 (EOF unclosed fence warned)'
          one_run 'fixture 26 (partial block at EOF not counted)'

          # 27 - within one file, a later accepted heading proves the fence was
          # never closed. The partial block is discarded, the retry parses.
          fresh
          { head_run; open_block 2026-08-05 first-try
            printf '\n## Run stats — retry\n\n'; block 2026-08-06 retry; } > "$fx/u.md"
          run
          expect "run-stats: unclosed fence: $fx/u.md:5" 'fixture 27 (unclosed fence names its opening line)'
          one_run 'fixture 27 (only the retry block counts)'

          # 28 - a new file starts outside any section: a fenced block with no
          # heading, sorted after a file whose section is still open, is not
          # collected (a second one would draw the second-block warning).
          fresh
          printf '# A\n\n## Run stats\n\nstill open at EOF\n' > "$fx/a.md"
          { block 2026-08-07 headless-1; printf '\n'; block 2026-08-08 headless-2; } > "$fx/b.md"
          run
          refute 'second block' 'fixture 28 (instats does not leak across files)'
          expect "  $fx/a.md:3" 'fixture 28 (the open section is listed as unfilled)'

          # 29 - CRLF checkout. The CR survives on any Linux awk; Git Bash's
          # gawk strips it in text-mode I/O, so this only proves anything on the
          # runner (see the CRLF note in .claude/CLAUDE.md).
          fresh
          sed 's/$/\r/' scripts/run-stats.example.md > "$fx/crlf.md"
          run
          one_run 'fixture 29 (CRLF input parses)'
          expect 'Actioned findings + escapes: 14 ' 'fixture 29 (CRLF denominator)'

          # 30 - filenames are attacker-shaped text: ESC and a newline in one
          # must not reach the terminal through ANY message that names a file.
          # (Linux only; NTFS refuses such names.)
          fresh
          pre=$(printf 'esc\033[31m\nX'); pre=${pre%X} # X keeps the trailing newline
          printf '# P\n\n## run stats\n' > "$fx/${pre}n.md"                      # near miss
          printf '# P\n\n## Run stats\n\n_todo_\n' > "$fx/${pre}u.md"             # unfilled
          printf '# P\n\n## Run stats\n\n```yaml\nTBD\n```\n' > "$fx/${pre}m.md"  # malformed
          printf '# P\n\n## Run stats\n\n```yaml\ndate: 2026-01-01\n' > "$fx/${pre}z.md" # unclosed
          { printf '# P\n\n## Run stats\n\n'; block 2026-01-02 pend-name | sed 's/^escaped: 0$/escaped: pending/'; } > "$fx/${pre}p.md" # pending
          { printf '# P\n\n## Run stats\n\n'; gblock 2026-01-03 bad-gates 'gates_failed: 9'; } > "$fx/${pre}g.md" # malformed gates_failed
          run
          refute_bytes '\033' 'fixture 30 (ESC from a filename)'
          expect "  $fx/esc?[31m?p.md:3" 'fixture 30 (pending listing)'
          expect "  $fx/esc?[31m?g.md:3" 'fixture 30 (malformed gates_failed listing)'
          expect "heading not parsed (expected \"## Run stats\"): $fx/esc?[31m?n.md:3" 'fixture 30 (near-miss warning)'
          expect "  $fx/esc?[31m?u.md:3" 'fixture 30 (unfilled listing)'
          expect "  $fx/esc?[31m?m.md:3" 'fixture 30 (malformed listing)'
          expect "unclosed fence: $fx/esc?[31m?z.md:5" 'fixture 30 (unclosed-fence warning)'

          # 31 - values: UTF-8 C1 (U+009B, the 8-bit CSI), a bidi override
          # (U+202E), LRM (U+200E) and ALM (U+061C) are neutralised too.
          fresh
          { head_run; block 2026-08-07 "$(printf 'a\302\233b')"
            printf '\n## Run stats — two\n\n'; block 2026-08-08 "$(printf 'c\342\200\256d')"
            printf '\n## Run stats — three\n\n'; block 2026-08-09 "$(printf 'e\342\200\216f')"
            printf '\n## Run stats — four\n\n'; block 2026-08-10 "$(printf 'g\330\234h')"; } > "$fx/v.md"
          run
          refute_bytes '\302\233' 'fixture 31 (UTF-8 C1 in a value)'
          refute_bytes '\342\200\256' 'fixture 31 (bidi override in a value)'
          refute_bytes '\342\200\216' 'fixture 31 (LRM in a value)'
          refute_bytes '\330\234' 'fixture 31 (ALM in a value)'
          expect 'a?b ' 'fixture 31 (C1 replaced)'
          expect 'c?d ' 'fixture 31 (bidi replaced)'
          expect 'e?f ' 'fixture 31 (LRM replaced)'
          expect 'g?h ' 'fixture 31 (ALM replaced)'

          # 32 - a relative path shaped like x=y is a path, not an awk variable
          # assignment. (A directory named fence=1 is fine on NTFS too.)
          fresh; mkdir -p "$fx/fence=1"
          { head_run; block 2026-08-09 assignment-shaped; } > "$fx/fence=1/p.md"
          run fence=1
          one_run 'fixture 32 (x=y path is read as a file)'

          # 33 - the bash-side message for a missing directory is sanitised by
          # the same clean() (that path exits 1, hence || true): ESC, a UTF-8 C1
          # pair and a bidi override all become ?.
          run "$fx/missing$(printf '\033\302\233\342\200\256')dir" || true
          refute_bytes '\033' 'fixture 33 (ESC from a directory name)'
          refute_bytes '\302\233' 'fixture 33 (C1 from a directory name)'
          refute_bytes '\342\200\256' 'fixture 33 (bidi from a directory name)'
          expect 'no such directory: ' 'fixture 33 (message printed)'
          expect 'missing???dir' 'fixture 33 (control bytes became ?)'

          # 34 - 0-3 leading spaces make a heading; 4 or more is a code block, so
          # it is neither parsed nor warned about.
          fresh
          { printf '# P\n\n  ## Run stats\n\n'; block 2026-08-10 indented-heading; } > "$fx/ind2.md"
          run
          one_run 'fixture 34 (two-space heading parses)'
          fresh
          { printf '# P\n\n    ## Run stats\n\n'; block 2026-08-10 code-block-heading; } > "$fx/ind4.md"
          run
          refute 'heading not parsed' 'fixture 34 (four-space line is not warned about)'
          refute 'Ratios over' 'fixture 34 (four-space line is not a heading)'

          # 35 - inside a four-backtick stats fence, a shorter info-string fence
          # line is content (CommonMark), not evidence the fence never closed.
          fresh
          { printf '# P\n\n## Run stats\n\n'
            block 2026-08-11 four-ticks | sed '1s/.*/````yaml/; $s/.*/````/; 3i```bash'; } > "$fx/four.md"
          run
          one_run 'fixture 35 (shorter info-string line inside a longer fence is content)'
          refute 'unclosed fence' 'fixture 35 (no unclosed-fence warning)'

          # 36 - when no run has a full set of counters the table prints but the
          # ratios do not, and the diagnostics still say why (usable == 0 path).
          # One unknown counter and one non-integer counter, so both causes are
          # counted separately.
          fresh
          { head_run; block 2026-08-12 unknown-counter | sed 's/^escaped: 0$/escaped: unknown/'
            printf '\n## Run stats — two\n\n'; block 2026-08-13 junk-counter | sed 's/^escaped: 0$/escaped: many/'; } > "$fx/inc.md"
          run
          expect 'No run had a complete set of counters' 'fixture 36 (no-usable-run message)'
          refute 'Ratios over' 'fixture 36 (no ratios computed)'
          expect '2 run(s) excluded from the ratios (incomplete counters).' 'fixture 36 (excluded count)'
          expect '1 counter(s) recorded as unknown or missing.' 'fixture 36 (unknown counted)'
          expect '1 counter(s) were neither an integer nor "unknown"' 'fixture 36 (suspect counted)'

          # 37 - the "skipped:" summary counts malformed blocks and unparsable
          # lines, on the ratios path and on the n == 0 path. A keyless placeholder
          # body such as TBD is itself an unparsable line, hence the counts below.
          fresh
          { printf '# A\n\n## Run stats\n\n'; block 2026-08-14 has-junk-line | sed '3ijunk without a colon'; } > "$fx/a.md"
          printf '# C\n\n## Run stats\n\n```yaml\nTBD\n```\n' > "$fx/c.md"
          run
          expect 'skipped: 1 malformed block(s), 2 unparsable line(s).' 'fixture 37 (skipped summary with ratios)'
          one_run 'fixture 37 (the good block still counts)'
          fresh
          printf '# C\n\n## Run stats\n\n```yaml\nTBD\n```\n' > "$fx/c.md"
          run
          expect 'run-stats: no run-stats blocks found.' 'fixture 37 (n == 0)'
          expect 'skipped: 1 malformed block(s), 1 unparsable line(s).' 'fixture 37 (skipped summary when nothing parsed)'

          # 38 - a directory literally named "-" is a path, not "the previous
          # directory" (cd - would print and then fail or resolve elsewhere).
          fresh; mkdir -p "$fx/-"
          { head_run; block 2026-08-15 dash-dir; } > "$fx/-/p.md"
          run - ./-
          one_run 'fixture 38 (directory named - is a path, and dedupes against ./-)'

          # 39 - the same (date, slug) in two files with different values is not
          # a duplicate, but it is said out loud (a stale copy or a collision).
          # Both runs still count.
          fresh
          { printf '# A\n\n## Run stats\n\n'; block 2026-08-16 shared-name; } > "$fx/a.md"
          { printf '# B\n\n## Run stats\n\n'; block 2026-08-16 shared-name | sed 's/^escaped: 0$/escaped: 1/'; } > "$fx/b.md"
          run
          expect '1 (date, slug) pair(s) appear in more than one file with different values' 'fixture 39 (cross-file name collision is reported)'
          expect 'Ratios over 2 complete run(s).' 'fixture 39 (both runs still count)'
          refute 'duplicate block' 'fixture 39 (not an exact duplicate)'

          # 40 - a directory that cannot be entered is reported, not skipped.
          # CI-only: NTFS has no chmod 000, and root ignores it, hence the guard.
          # Not mutation-verified locally for the same reason.
          if [ "$(id -u)" != 0 ]; then
            fresh; mkdir -p "$fx/locked"
            { head_run; block 2026-08-17 locked-dir; } > "$fx/locked/p.md"
            chmod 000 "$fx/locked"
            run "$fx/locked" || true
            chmod 755 "$fx/locked"
            expect 'run-stats: cannot enter directory:' 'fixture 40 (unreadable directory is reported)'
          fi

          # 41 - a pair shared by three files is still one pair, said once.
          fresh
          for e in 0 1 2; do
            { head_run; block 2026-08-18 three-way | sed "s/^escaped: 0\$/escaped: $e/"; } > "$fx/f$e.md"
          done
          run
          expect '1 (date, slug) pair(s) appear in more than one file' 'fixture 41 (a pair in three files is counted once)'

          # 42 - a block seeded exactly as a plan seeds it: plan counters known,
          # everything else pending. It is listed as still pending, by file:line,
          # and kept out of the ratios; pending is not "unknown" and not suspect.
          # The complete run beside it proves the denominator is untouched.
          fresh
          { printf '# P\n\n## Run stats\n\n```yaml\ndate: 2026-09-01\nslug: seeded\ngear: full\neffort_plan: high\n'
            printf 'effort_diff: pending\nfindings_plan_actioned: 3\nfindings_plan_rejected: 1\nfindings_plan_dropped: 0\n'
            printf 'findings_diff_actioned: pending\nfindings_diff_rejected: pending\nfindings_diff_dropped: pending\n'
            printf 'escaped: pending\nagents_spawned: pending\ngates_failed: pending\nescalated_from: none\n```\n'; } > "$fx/p.md"
          { head_run; block 2026-09-02 finished-run; } > "$fx/q.md"
          run
          expect '1 run(s) still pending (unfinished or abandoned):' 'fixture 42 (pending run counted)'
          expect "  $fx/p.md:3" 'fixture 42 (pending run named by file:line)'
          refute "$fx/q.md:" 'fixture 42 (finished run is not listed)'
          one_run 'fixture 42 (pending run is out of the ratios)'
          expect 'Actioned findings + escapes: 2 ' 'fixture 42 (pending plan counters stay out of the denominator)'
          refute 'recorded as unknown or missing' 'fixture 42 (pending is not folded into unknown)'
          refute 'neither an integer' 'fixture 42 (pending is not a suspect value)'

          # 43 - gates_failed is normalised (spaces, brackets, order) and
          # validated: "2, 4" and "[4,2]" are the list 2,4 and each counts G2 and
          # G4 once; "2,6" names no gate 6, is reported on its own line, and still
          # counts as a row (it is not a ratio counter) but not in the tally.
          fresh
          { head_run; gblock 2026-09-03 spaced 'gates_failed: 2, 4'
            printf '\n## Run stats — two\n\n'; gblock 2026-09-04 bracketed 'gates_failed: [4,2]'
            printf '\n## Run stats — three\n\n'; gblock 2026-09-05 bad-gate 'gates_failed: 2,6'; } > "$fx/g.md"
          run
          expect 'runs with a fix loop, by gate (2 runs with gates_failed): G1 0 · G2 2 · G3 0 · G4 2 · G5 0' 'fixture 43 (list normalised, tally counts each gate once per run)'
          expect '1 gates_failed value(s) not none, pending, unknown or a list of gates 1–5:' 'fixture 43 (malformed value has its own listing)'
          l3=$(grep -n 'Run stats — three' "$fx/g.md" | cut -d: -f1)
          expect "  $fx/g.md:$l3" 'fixture 43 (malformed value named by file:line)'
          expect 'Ratios over 3 complete run(s).' 'fixture 43 (malformed gates_failed does not exclude the run)'
          refute 'neither an integer' 'fixture 43 (not reported as a suspect counter)'

          # 44 - a legacy block (gates_failed_first_pass, no gates_failed) still
          # parses and shows the count as n=2, so it cannot read as "gate 2" (a
          # non-integer legacy value, such as 2x, gets the same n= prefix). Legacy
          # rows are not tallied, and the tally line says so rather than showing
          # zeros that read as "no loops".
          fresh
          { head_run; gblock 2026-09-06 legacy 'gates_failed_first_pass: 2'
            printf '\n## Run stats — two\n\n'; gblock 2026-09-06 legacy-odd 'gates_failed_first_pass: 2x'; } > "$fx/l.md"
          run
          expect 'Ratios over 2 complete run(s).' 'fixture 44 (legacy blocks parse)'
          expect ' n=2 ' 'fixture 44 (legacy count rendered n=2)'
          expect ' n=2x ' 'fixture 44 (non-integer legacy value is prefixed too)'
          expect '(0 runs with gates_failed): G1 0 · G2 0 · G3 0 · G4 0 · G5 0 — 2 legacy rows not tallied' 'fixture 44 (legacy rows are counted as not tallied)'
          refute 'gates_failed value' 'fixture 44 (legacy key is not a malformed gates_failed)'

          # 45 - unknown and none are valid gates_failed values and not malformed;
          # none joins the tally as a run with zero loops, unknown does not. A
          # gates_failed of pending holds the block open: the run is listed as still
          # pending, kept out of the ratios, and kept out of the tally.
          fresh
          { head_run; gblock 2026-09-07 pend-gates 'gates_failed: pending'
            printf '\n## Run stats — two\n\n'; gblock 2026-09-08 unk-gates 'gates_failed: unknown'
            printf '\n## Run stats — three\n\n'; gblock 2026-09-09 no-loops 'gates_failed: none'; } > "$fx/s.md"
          run
          refute 'gates_failed value' 'fixture 45 (pending and unknown are not malformed)'
          expect 'runs with a fix loop, by gate (1 runs with gates_failed): G1 0 · G2 0 · G3 0 · G4 0 · G5 0' 'fixture 45 (only none joins the tally, as zero loops)'
          expect 'Ratios over 2 complete run(s).' 'fixture 45 (the pending run is out of the ratios)'
          expect '1 run(s) still pending (unfinished or abandoned):' 'fixture 45 (pending gates_failed holds the run open)'
          expect "  $fx/s.md:3" 'fixture 45 (pending run named by file:line)'

          # 46, 47 - pending in a key that is not a gating counter still holds the
          # run open (its running totals may be partial): only escaped, then only
          # agents_spawned. Every other counter is an integer; the finished sibling
          # proves the denominator is untouched.
          for key in escaped agents_spawned; do
            fresh
            { head_run; block 2026-09-10 "open-$key" | sed "s/^$key: [0-9]*\$/$key: pending/"; } > "$fx/o.md"
            { head_run; block 2026-09-11 finished-run; } > "$fx/q.md"
            run
            expect '1 run(s) still pending (unfinished or abandoned):' "fixture 46/47 ($key pending lists the run)"
            expect "  $fx/o.md:3" "fixture 46/47 ($key pending named by file:line)"
            one_run "fixture 46/47 ($key pending keeps the run out of the ratios)"
            expect 'Actioned findings + escapes: 2 ' "fixture 46/47 ($key pending leaves the denominator alone)"
            refute 'recorded as unknown or missing' "fixture 46/47 ($key pending is not unknown)"
          done

          # 48 - the duplicate check compares the NORMALISED gates_failed, so the
          # same list spelled "2,4" and "[4, 2]" is one value, in two files.
          fresh
          { head_run; gblock 2026-09-12 same-plan 'gates_failed: 2,4'; } > "$fx/a.md"
          { head_run; gblock 2026-09-12 same-plan 'gates_failed: [4, 2]'; } > "$fx/b.md"
          run
          expect '1 duplicate block(s) (identical values)' 'fixture 48 (equal gate lists spelled differently are a duplicate)'

          # 49 - with both keys present, gates_failed is the cell and the legacy
          # count is neither shown nor counted.
          fresh
          { head_run; gblock 2026-09-13 both-keys 'gates_failed: 2,4\ngates_failed_first_pass: 3'; } > "$fx/b.md"
          run
          expect ' 2,4 ' 'fixture 49 (the list is shown)'
          refute 'n=' 'fixture 49 (the legacy count is not shown)'
          refute 'legacy row' 'fixture 49 (the legacy count is not counted)'

          # 50 - a pending run with a valid gates_failed list is out of the tally
          # too: its loops are a running total, not a result. The finished sibling
          # (none) is the only tallied run.
          fresh
          { head_run; gblock 2026-09-14 open-run 'gates_failed: 2,4' | sed 's/^escaped: 0$/escaped: pending/'; } > "$fx/o.md"
          { head_run; gblock 2026-09-15 closed-run 'gates_failed: none'; } > "$fx/q.md"
          run
          expect 'runs with a fix loop, by gate (1 runs with gates_failed): G1 0 · G2 0 · G3 0 · G4 0 · G5 0' 'fixture 50 (pending run is not tallied)'

          # 51 - a legacy gates_failed_first_pass of none, unknown or pending is
          # shown as the word, never as n=none: only a count gets the n= prefix.
          # (The default block carries none; the others are rewritten.) The GATES
          # cell is the 9-wide column, so the word is followed by a space.
          fresh
          { head_run; block 2026-09-16 legacy-none
            printf '\n## Run stats — two\n\n'; gblock 2026-09-17 legacy-unknown 'gates_failed_first_pass: unknown'
            printf '\n## Run stats — three\n\n'; gblock 2026-09-18 legacy-pending 'gates_failed_first_pass: pending'; } > "$fx/w.md"
          run
          expect ' none      none ' 'fixture 51 (legacy none is shown as none)'
          expect ' unknown   none ' 'fixture 51 (legacy unknown is shown as unknown)'
          expect ' pending   none ' 'fixture 51 (legacy pending is shown as pending)'
          refute 'n=none' 'fixture 51 (legacy none is not prefixed)'
          refute 'n=unknown' 'fixture 51 (legacy unknown is not prefixed)'
          refute 'n=pending' 'fixture 51 (legacy pending is not prefixed)'

          # 52 - a malformed gates_failed is shown in the GATES cell exactly as
          # written (so the reader sees what to fix) and is listed. Gate 0 is not
          # a gate: the valid range is 1-5, both ends.
          fresh
          { head_run; gblock 2026-09-19 zero-gate 'gates_failed: 0'
            printf '\n## Run stats — two\n\n'; gblock 2026-09-20 junk-gate 'gates_failed: 2;x'; } > "$fx/z.md"
          run
          expect '2 gates_failed value(s) not none, pending, unknown or a list of gates 1–5:' 'fixture 52 (gate 0 and 2;x are both malformed)'
          expect ' 0         none ' 'fixture 52 (gate 0 shown as written)'
          expect ' 2;x       none ' 'fixture 52 (malformed value shown as written)'
          refute 'runs with a fix loop' 'fixture 52 (malformed rows are not tallied, so no tally line)'

          exit "$fail"

  ref-check:
    name: ref-check.sh (docs ↔ agents/skills)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The repo's own references must resolve
        # Invoked as `sh`, not `bash`, so the POSIX constraint is exercised
        # rather than merely linted.
        run: sh scripts/ref-check.sh
      - name: Prove every check can fail, one fixture each
        run: |
          # A checker that quietly matches nothing exits 0 forever and reads as
          # green — worse than no checker. So each of the four checks gets its
          # own broken fixture, and each assertion greps for THAT check's
          # message rather than only the exit status: asserting exit status
          # alone lets three of the four checks be deleted with the job still
          # green (measured). This mirrors the run-stats job, which likewise
          # asserts computed output rather than a bare exit code.
          #
          # REF_CHECK_ALLOW_UNTRACKED=1 is required because the fixtures are not
          # git repos; the checker otherwise refuses to enumerate untracked
          # files, which is what stops it reading a private ~/.claude tree.
          fx="$RUNNER_TEMP/ref-fixture"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_fail() { # $1 = message substring, $2 = label
            if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$2: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$1" || {
              echo "::error::$2: expected message not found: $1"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $2"
          }

          build_good
          REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" \
            || { echo "::error::good fixture should pass but did not"; exit 1; }
          echo "  ok — good fixture passes"

          # check 1 — frontmatter name no longer matches its filename
          build_good
          printf -- '---\nname: wrong-name\n---\nbody\n' > "$fx/agents/demo-critic.md"
          expect_fail 'does not match filename' 'check 1 (frontmatter vs filename)'

          # check 2 Rule A — dangling hyphenated reference
          build_good
          printf 'The `demo-critic` agent, `demo-skill` skill, `nonexistent-critic`.\n' > "$fx/CLAUDE.md"
          expect_fail 'unresolved reference' 'check 2 Rule A (hyphenated name)'

          # check 2 Rule B — not hyphenated; caught only by the role word,
          # across a bold marker, which is the reflow that defeats naive matching
          build_good
          printf 'The `demo-critic` agent, `demo-skill` skill, **`ghostagent`** subagent.\n' > "$fx/CLAUDE.md"
          expect_fail 'unresolved reference' 'check 2 Rule B (role word after bold span)'

          # check 3 — an agent that exists but nothing references
          build_good
          printf -- '---\nname: orphan-agent\n---\nbody\n' > "$fx/agents/orphan-agent.md"
          expect_fail 'is never referenced' 'check 3 (orphaned definition)'

          # check 4 — a README link whose target does not exist
          build_good
          printf '# R\n\n[c](./agents/demo-critic.md) [x](./missing.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          expect_fail 'does not exist' 'check 4 (dangling README link)'
      - name: A fence closes only with the marker that opened it
        run: |
          # A ~~~ line inside a ``` block must not close it. If it does, the
          # rest of the block is tokenized and every backticked example in a
          # code block becomes a build failure. Asserting the CLEAN case is
          # what makes this a real test: with fence matching broken, the
          # phantom reference escapes the block and the run fails.
          fx="$RUNNER_TEMP/ref-fixture-fence"
          rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
          printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
          printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
          printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          {
            printf 'The `demo-critic` agent, `demo-skill` skill.\n'
            printf '```\n~~~\n`phantom-critic`\n```\n'
          } > "$fx/CLAUDE.md"
          REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" || {
            echo "::error::a ~~~ inside a \`\`\` block closed it early — fence marker matching is broken"
            exit 1
          }
          echo "  ok — mismatched fence markers do not close a block"
      - name: Prove a stray CR cannot silently disarm the classifier
        run: |
          # Markdown checks out CRLF on Windows while CI checks out LF, so a
          # \r regression is invisible here unless a CR is injected on purpose.
          #
          # Fixture design matters more than it looks. Appending CR to every
          # line end (`sed 's/$/\r/'`) is TAUTOLOGICAL — measured: the fixture
          # still fails with the \r strip removed, because some awks (notably
          # GNU awk under Git Bash) strip a trailing CR from $0 themselves, and
          # because a Rule-A break fails either way. The CR only bites in one
          # position: between a backtick span and the role word that makes
          # Rule B fire, where the gap class [ \t]* does not match it.
          #
          # So the fixture puts it exactly there, and the assertion greps for
          # the message rather than the exit status. Verified against a mutant
          # with the \r strip deleted: real script exits 1 naming the token,
          # mutant reports "clean".
          fx="$RUNNER_TEMP/ref-fixture-crlf"
          rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
          printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
          printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
          printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          printf 'The `demo-critic` agent, `demo-skill` skill.\nSee **`ghostagent`**\r subagent here.\n' > "$fx/CLAUDE.md"
          if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
            echo "::error::CR-bearing corpus reported clean — the \\r strip is broken"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'unresolved reference' || {
            echo "::error::CR corpus failed for the wrong reason — Rule B did not fire, so the \\r strip is broken"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — Rule B still fires with a CR between the span and the role word"
      - name: Refuse to report a false clean pass on an empty tree
        run: |
          empty="$RUNNER_TEMP/ref-empty"
          rm -rf "$empty"; mkdir -p "$empty"
          printf '# R\n' > "$empty/README.md"
          printf 'nothing here\n' > "$empty/CLAUDE.md"
          if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$empty" 2>&1); then
            echo "::error::empty inventory reported clean instead of failing loudly"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'refusing to report a false clean pass' || {
            echo "::error::empty tree failed, but not via the fail-loud floor"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — empty tree fails loudly"
      - name: Refuse to enumerate untracked files without an explicit opt-in
        run: |
          # The guard that stops `ref-check.sh ~/.claude` printing private
          # agent and skill names out of an untracked tree.
          fx="$RUNNER_TEMP/ref-fixture-optin"
          rm -rf "$fx"; mkdir -p "$fx/agents"
          printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
          printf '# R\n' > "$fx/README.md"
          printf '`demo-critic` agent\n' > "$fx/CLAUDE.md"
          if out=$(sh scripts/ref-check.sh "$fx" 2>&1); then
            echo "::error::non-git tree was enumerated without REF_CHECK_ALLOW_UNTRACKED"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'refusing to enumerate untracked files' || {
            echo "::error::non-git tree failed, but not via the opt-in guard"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — untracked enumeration requires opt-in"
      - name: Prove the fail-loud floors, and two silent classifier fail-opens
        run: |
          # Three more floors guard against a checker that quietly matches
          # nothing: zero backtick tokens extracted at all, zero of those
          # tokens surviving Rule A/B classification, and zero relative
          # README link targets found. Alongside them: two ways a single
          # name or reference can be silently DROPPED rather than flagged —
          # check 3's self-exclusion (a name mentioned only inside its own
          # defining file must still count as unreferenced, or the check
          # falsifies its own point) and the leading-`/` strip (an
          # unresolved `/phantom-skill` reference must surface as
          # `phantom-skill` in the failure message, not vanish past check
          # 2's shape re-validation). Verified against mutants with each
          # mechanism removed: the real script fails, the mutant reports
          # clean.
          fx="$RUNNER_TEMP/ref-fixture-floors"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_fail() { # $1 = message substring, $2 = label
            if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$2: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$1" || {
              echo "::error::$2: expected message not found: $1"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $2"
          }

          # floor — zero backtick tokens extracted at all
          build_good
          printf 'No backtick tokens here at all, plain prose only.\n' > "$fx/CLAUDE.md"
          expect_fail 'zero backtick tokens extracted' 'floor (zero backtick tokens)'

          # floor — tokens exist but none survive Rule A/B classification
          build_good
          printf 'See `foo` and `bar` do their thing, no role words nearby.\n' > "$fx/CLAUDE.md"
          expect_fail 'zero Rule-A/B-selected tokens' 'floor (zero classified tokens)'

          # floor — README has links, but none are relative
          build_good
          printf '# R\n\n[ext](https://example.com) [anchor](#top)\n' > "$fx/README.md"
          expect_fail 'zero relative link targets' 'floor (zero README link targets)'

          # check 3 — a name mentioned ONLY inside its own defining file
          build_good
          printf -- '---\nname: demo-skill\n---\nSelf mention of the `demo-skill` skill here in its own body.\n' > "$fx/skills/demo-skill/SKILL.md"
          printf 'The `demo-critic` agent only, no mention of the skill.\n' > "$fx/CLAUDE.md"
          printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic`\n' > "$fx/README.md"
          expect_fail 'is never referenced' 'check 3 (self-mention does not count)'

          # check 2 — a dangling `/`-prefixed reference must resolve to the
          # STRIPPED name in the message, not silently vanish
          build_good
          printf 'The `demo-critic` agent, `demo-skill` skill, and the `/phantom-skill` skill.\n' > "$fx/CLAUDE.md"
          expect_fail 'unresolved reference `phantom-skill`' 'check 2 (leading-slash strip)'
      - name: Prove the skills arm of check 1 catches what the agents arm catches
        run: |
          # check 1 runs twice — once per agents/*.md against its filename,
          # once per skills/*/SKILL.md against its DIRECTORY name — and
          # every fixture above only ever breaks the agents arm.
          fx="$RUNNER_TEMP/ref-fixture-skills-check1"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_fail() { # $1 = message substring, $2 = label
            if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$2: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$1" || {
              echo "::error::$2: expected message not found: $1"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $2"
          }

          build_good
          printf -- '---\nname: wrong-skill-name\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
          expect_fail 'does not match directory name' 'check 1 skills arm (name vs directory)'

          build_good
          printf -- '---\nname:\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
          expect_fail 'has no (or empty) frontmatter' 'check 1 skills arm (empty name)'
      - name: Prove the git ls-files branch reads tracked files only
        run: |
          # Every fixture above is a plain (non-git) tree, so only the glob
          # fallback gets exercised by a controlled fixture — the git
          # ls-files branch otherwise runs only against this very checkout,
          # which never has a stray untracked agents/*.md lying around to
          # prove the filter with. `git init` + `git add` (no commit — a
          # stock runner has no configured identity, and none is needed:
          # `git ls-files` reads the INDEX, which `add` alone populates)
          # builds a fixture that takes the git branch on purpose.
          gx="$RUNNER_TEMP/ref-fixture-git"
          rm -rf "$gx"; mkdir -p "$gx/agents" "$gx/skills/demo-skill"
          printf -- '---\nname: demo-critic\n---\nbody\n' > "$gx/agents/demo-critic.md"
          printf -- '---\nname: demo-skill\n---\nbody\n' > "$gx/skills/demo-skill/SKILL.md"
          printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$gx/README.md"
          printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$gx/CLAUDE.md"
          ( cd "$gx" && git init -q && git add -A ) >/dev/null 2>&1

          # an UNTRACKED file with frontmatter that would fail check 1 if
          # read — proves the git branch enumerates the index, not the disk
          printf -- '---\nname: totally-broken-name\n---\nbody\n' > "$gx/agents/leaked-secret.md"

          if ! out=$(sh scripts/ref-check.sh "$gx" 2>&1); then
            echo "::error::git-tracked fixture failed — the untracked stray file leaked into the check:"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'ref-check: clean' || {
            echo "::error::git-tracked fixture did not print the clean line"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — untracked stray file is invisible to the git ls-files branch"
      - name: Prove frontmatter and extraction edge cases survive parsing
        run: |
          # BOM strip, quoted-name strip, and fence handling are all
          # "silent success" risks: a fixture that never actually exercises
          # the feature ALSO prints clean. Each positive case below pairs a
          # phantom reference that would only surface if the feature were
          # broken (verified against mutants with each mechanism removed —
          # real script clean, mutant fails), plus two negative cases with
          # distinct messages.
          fx="$RUNNER_TEMP/ref-fixture-parsing"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_clean() { # $1 = label
            if ! out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$1: expected clean but checker failed:"; printf '%s\n' "$out"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF 'ref-check: clean' || {
              echo "::error::$1: did not print the clean line"; printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $1"
          }

          # BOM: a leading UTF-8 BOM on a frontmatter file must not defeat
          # the "line 1 is ---" guard
          build_good
          bom=$(printf '\357\273\277')
          printf '%s---\nname: demo-critic\n---\nbody\n' "$bom" > "$fx/agents/demo-critic.md"
          expect_clean 'BOM-prefixed frontmatter still parses'

          # quoted name: name: "demo-critic" must strip to demo-critic, not
          # fail shape validation on the quote marks themselves
          build_good
          printf -- '---\nname: "demo-critic"\n---\nbody\n' > "$fx/agents/demo-critic.md"
          expect_clean 'quoted frontmatter name strips correctly'

          # a ~~~ fence and an indented ``` fence must both suppress the
          # backtick tokens inside them
          build_good
          printf 'The `demo-critic` agent and the `demo-skill` skill.\n\n~~~\nSee `phantom-agent` agent, not real, inside a tilde fence.\n~~~\n\n    ```\n    Also `ghost-skill` skill inside an indented backtick fence.\n    ```\n' > "$fx/CLAUDE.md"
          expect_clean '~~~ and indented ``` fences both suppress their contents'

          # an unclosed fence must fail loudly, not silently swallow the
          # rest of the file
          build_good
          printf 'The `demo-critic` agent and the `demo-skill` skill.\n\n```\nunclosed fence never ends\n' > "$fx/CLAUDE.md"
          if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
            echo "::error::unclosed fence: checker reported clean but should have failed"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'unclosed fenced code block' || {
            echo "::error::unclosed fence: expected message not found"; printf '%s\n' "$out"; exit 1
          }
          echo "  ok — unclosed fence"

          # an invalid-shape name must be rejected AND never echoed back —
          # the header promises the value itself never appears in output
          build_good
          printf -- '---\nname: XSENTINEL_INVALID_SHAPE_VALUE\n---\nbody\n' > "$fx/agents/demo-critic.md"
          if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
            echo "::error::invalid name shape: checker reported clean but should have failed"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'has an invalid shape' || {
            echo "::error::invalid name shape: expected message not found"; printf '%s\n' "$out"; exit 1
          }
          if printf '%s\n' "$out" | grep -qF 'XSENTINEL_INVALID_SHAPE_VALUE'; then
            echo "::error::invalid name shape: the rejected value was echoed into output — leak risk"
            exit 1
          fi
          echo "  ok — invalid name shape rejected and never echoed"
      - name: Prove README link-target edge cases
        run: |
          fx="$RUNNER_TEMP/ref-fixture-links"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_fail() { # $1 = message substring, $2 = label
            if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$2: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$1" || {
              echo "::error::$2: expected message not found: $1"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $2"
          }

          # an absolute link target is rejected outright, distinctly from
          # "does not exist"
          build_good
          printf '# R\n\n[c](./agents/demo-critic.md) [abs](/etc/passwd) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          expect_fail 'is absolute' 'check 4 (absolute link target)'

          # a target containing a `..` path component is likewise rejected
          # outright
          build_good
          printf '# R\n\n[c](./agents/demo-critic.md) [dd](../outside.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          expect_fail 'contains a `..` path component' 'check 4 (.. path component)'

          # README.md missing entirely
          build_good
          rm -f "$fx/README.md"
          expect_fail 'README.md not found at repo root' 'check 4 (missing README.md)'
      - name: Prove root-resolution edge cases
        run: |
          # A non-directory root, and no root argument outside a git repo
          # entirely — neither needs REF_CHECK_ALLOW_UNTRACKED, since both
          # fail before that gate is even reached. $RUNNER_TEMP is a
          # sibling of the checkout, not nested inside it, and has no git
          # repo anywhere in its ancestor chain, so the second case is
          # deterministic on a standard GitHub-hosted runner.
          # Note the `if`: GitHub runs steps as `bash -e`, so a bare
          # `out=$(failing-cmd)` aborts the step before the next line runs.
          # Every negative assertion here must keep the substitution inside an
          # `if`/`||` for that reason.
          if out=$(sh scripts/ref-check.sh "$RUNNER_TEMP/ref-does-not-exist-xyz" 2>&1); then
            echo "::error::non-existent root: checker reported clean but should have failed"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'is not a directory' || {
            echo "::error::non-existent root: expected message not found"; printf '%s\n' "$out"; exit 1
          }
          echo "  ok — non-directory root rejected"

          nogit="$RUNNER_TEMP/ref-no-git-dir"
          rm -rf "$nogit"; mkdir -p "$nogit"
          script_abs="$PWD/scripts/ref-check.sh"
          if out=$(cd "$nogit" && sh "$script_abs" 2>&1); then
            echo "::error::no root outside a git repo: checker reported clean but should have failed"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'not inside a git repo' || {
            echo "::error::no root outside a git repo: expected message not found"; printf '%s\n' "$out"; exit 1
          }
          echo "  ok — no root argument outside a git repo rejected"

  version-guard:
    name: version-check.sh (tag ↔ plugin manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove every check can fail, one fixture each
        # Runs on EVERY push and PR, not just tags. The real check below only
        # fires on a tag push, so without these fixtures the script would sit
        # unexercised between releases and first prove itself broken at the one
        # moment it matters. Each assertion greps for THAT check's message
        # rather than the exit status: several of these paths exit 1 for more
        # than one reason, so exit-status-only assertions would let guards be
        # deleted with the job still green (the same measurement that shaped
        # the ref-check job above).
        #
        # Invoked as `sh`, not `bash`, so the POSIX constraint is exercised
        # rather than merely linted.
        run: |
          fx="$RUNNER_TEMP/version-fixture"
          rm -rf "$fx"; mkdir -p "$fx"
          printf '{\n  "name": "x",\n  "version": "1.2.3"\n}\n' > "$fx/good.json"

          expect_clean() { # $1 = tag, $2 = manifest, $3 = label
            if ! out=$(sh scripts/version-check.sh "$1" "$2" 2>&1); then
              echo "::error::$3: expected clean but the checker failed:"; printf '%s\n' "$out"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF 'version-check: clean' || {
              echo "::error::$3: did not print the clean line"; printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $3"
          }

          expect_fail() { # $1 = tag, $2 = manifest, $3 = message substring, $4 = label
            # Note the `if`: steps run as `bash -e`, so a bare
            # `out=$(failing-cmd)` would abort before the assertion below.
            if out=$(sh scripts/version-check.sh "$1" "$2" 2>&1); then
              echo "::error::$4: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$3" || {
              echo "::error::$4: expected message not found: $3"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $4"
          }

          expect_clean 'v1.2.3' "$fx/good.json" 'matching tag and manifest pass'

          # a prerelease tag is a first-class case, not a loud failure at the
          # worst possible moment
          printf '{\n  "version": "1.3.0-rc.1"\n}\n' > "$fx/rc.json"
          expect_clean 'v1.3.0-rc.1' "$fx/rc.json" 'prerelease tag accepted'

          expect_fail 'v1.2.4' "$fx/good.json" 'does not match' 'mismatched tag'

          # THE WIRING BUG. `github.ref` is refs/tags/v1.2.3 and `github.ref_name`
          # is v1.2.3; passing the wrong one would fail every release forever, and
          # no bare-tag fixture can catch it. Hence its own message and its own
          # case — deleting the guard makes this fail on shape instead, which is
          # a different string, which is why the assertion greps the message.
          expect_fail 'refs/tags/v1.2.3' "$fx/good.json" 'looks like a full git ref' 'full ref passed instead of ref_name'

          expect_fail '1.2.3' "$fx/good.json" 'has an invalid shape' 'tag missing its v prefix'
          expect_fail 'v1.2.3' "$fx/absent.json" 'not found (run from the repo root' 'missing manifest'

          printf '{\n  "name": "x"\n}\n' > "$fx/nokey.json"
          expect_fail 'v1.2.3' "$fx/nokey.json" 'has no "version" key' 'floor (no version key)'

          printf '{\n  "version": "1.2.3",\n  "dep": { "version": "9.9.9" }\n}\n' > "$fx/twokeys.json"
          expect_fail 'v1.2.3' "$fx/twokeys.json" 'ambiguous, refusing to guess' 'floor (ambiguous version keys)'

          # THE REGRESSION. Same two keys, ONE line — which is what any reflow
          # (`jq -c`, a formatter) produces. Counting matching LINES instead of
          # occurrences made this a silent false clean: `v9.9.9` passed while the
          # top-level version was 1.2.3, and the correct `v1.2.3` was rejected.
          # Both directions are asserted, because the version that fails on the
          # right tag is only half the symptom.
          printf '{"name":"x","version":"1.2.3","dep":{"version":"9.9.9"}}\n' > "$fx/oneline.json"
          expect_fail 'v9.9.9' "$fx/oneline.json" 'ambiguous, refusing to guess' 'regression (single-line nested version, wrong tag)'
          expect_fail 'v1.2.3' "$fx/oneline.json" 'ambiguous, refusing to guess' 'regression (single-line nested version, right tag)'

          printf '{\n  "version": 123\n}\n' > "$fx/unquoted.json"
          expect_fail 'v1.2.3' "$fx/unquoted.json" 'could not extract its value' 'floor (unparseable value)'

          printf '{\n  "version": "not-a-version"\n}\n' > "$fx/junk.json"
          expect_fail 'v1.2.3' "$fx/junk.json" 'version has an invalid shape' 'manifest value rejected on shape'

          # The arity guard exits 2, not 1, so expect_fail's helpers would read
          # it as an ordinary failure — assert it on its own terms.
          for args in '' 'a b c'; do
            # shellcheck disable=SC2086 # deliberate word splitting: '' means no args
            if out=$(sh scripts/version-check.sh $args 2>&1); then
              echo "::error::arity guard: reported clean with [$args]"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF 'usage: version-check.sh' || {
              echo "::error::arity guard: no usage message with [$args]"; printf '%s\n' "$out"; exit 1
            }
          done
          echo "  ok — wrong argument count prints usage"
      - name: The real manifest must stay parseable on every push
        # The default-manifest path is the ONLY path the real check uses, and
        # every fixture above passes an explicit manifest argument — so without
        # this step, default-path resolution and extraction against the real
        # .claude-plugin/plugin.json would first be exercised at release time,
        # where recovery means deleting a pushed tag.
        #
        # Non-tautological, and it never needs updating when the version is
        # bumped: v0.0.0 must NOT match, and it can only reach the comparison at
        # all if the default path resolved and extraction worked. Rename or
        # break the manifest's `version` key and the message becomes a floor
        # message instead, failing here at PR time.
        run: |
          if out=$(sh scripts/version-check.sh v0.0.0 2>&1); then
            echo "::error::v0.0.0 matched the real manifest — that cannot be right"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'expected tag `v' || {
            echo "::error::the real manifest never reached the comparison — default-path resolution or extraction is broken"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — the real manifest resolves and parses"
      - name: The real tag must agree with the real manifest
        # No step-level `if:`. A wrong condition there makes this a grey no-op
        # while the job still reads green — the "quietly matches nothing exits 0
        # forever" failure, relocated from the script into CI config where no
        # fixture can reach it. Branching inside the body means the step always
        # runs and logs why it did nothing.
        #
        # $GITHUB_REF_NAME is the bare tag (v1.0.0); $GITHUB_REF is the full ref
        # (refs/tags/v1.0.0). Using the built-in env vars rather than a `${{ }}`
        # expansion also keeps the tag name out of the text substituted into the
        # script body before the shell sees it.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              sh scripts/version-check.sh "$GITHUB_REF_NAME"
              ;;
            *)
              echo "  not a tag push ($GITHUB_REF) — the real check is not applicable; the fixtures above are this job"
              ;;
          esac

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint install.ps1 and settings-drift.ps1 (errors fail; warnings reported)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = foreach ($f in './install.ps1', './scripts/settings-drift.ps1') {
            Invoke-ScriptAnalyzer -Path $f -Severity Error, Warning
          }
          if ($results) { $results | Format-Table -AutoSize | Out-String | Write-Host }
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

  settings-drift:
    name: settings-drift.sh (fixtures + installer wiring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes; the token need not stay in .git/config while
          # the installer runs against a scratch HOME.
          persist-credentials: false
      - name: Confirm jq is present
        # ubuntu-latest ships jq; the install is a belt-and-braces fallback so a
        # runner-image change cannot turn every fixture into "jq not found".
        # apt-get update first: a fresh runner's package index can be stale
        # enough for the install to 404. The version is echoed so a fixture
        # failure after an image bump can be read against the jq it ran on.
        run: |
          command -v jq >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y jq; }
          jq --version
      - name: Every fixture must print exactly its expected output
        # Invoked as `sh`, not `bash`, so the POSIX constraint is exercised
        # rather than merely linted. The fixtures ARE the contract shared with
        # settings-drift.ps1 (see the windows job below); each assertion is on
        # the exact output, the exit code, or a named absence, never on "did it
        # run". What each guard is proven by, should it ever be deleted:
        #   - the exact comparison: wrong-case-rule and the type-mismatch-* cases
        #     (their outputs differ by a single line); substring-superset is the
        #     one that kills a substring/`contains` match (live holds strings
        #     that contain the repo rule, so a substring match hides the gap);
        #     substring-trap is only a near-miss (live has just the `.*` variants);
        #   - the exit code: any drift fixture, e.g. missing-array-rule;
        #   - the sentinel check: sentinel-never-printed (a secret-like live
        #     string in a hook command, a live-only key and a type mismatch);
        #   - the zero-fixture floor: point $fx at an empty directory.
        run: |
          fx=scripts/settings-drift-fixtures
          clean='settings: no repo setting missing or different (live-only settings not checked)'
          n=0
          for dir in "$fx"/*/; do
            dir=${dir%/}
            name=$(basename "$dir")
            n=$((n + 1))

            # jq parse errors name the tool, so two cases carry expected.jq.txt
            # instead of the shared expected.txt (PowerShell: expected.ps.txt).
            if [ -f "$dir/expected.txt" ]; then exp="$dir/expected.txt"
            elif [ -f "$dir/expected.jq.txt" ]; then exp="$dir/expected.jq.txt"
            else echo "::error::$name: no expected.txt or expected.jq.txt"; exit 1
            fi

            # The exit code is not stored: it is implied by the expected output
            # (fixtures README), so a fixture cannot drift from its own code.
            tr -d '\r' < "$exp" > "$RUNNER_TEMP/drift.want"
            if [ "$(cat "$RUNNER_TEMP/drift.want")" = "$clean" ]; then want=0
            elif grep -qE '^settings drift: (missing|differs) ' "$RUNNER_TEMP/drift.want"; then want=1
            elif grep -q '^settings drift: not checked' "$RUNNER_TEMP/drift.want"; then want=2
            else echo "::error::$name: cannot derive an exit code from $exp"; exit 1
            fi

            # Note the `|| rc=$?`: steps run as `bash -e`, so a bare command that
            # exits 1 or 2 (both normal here) would abort the step; a command
            # on the left of `||` is exempt from -e.
            rc=0
            sh scripts/settings-drift.sh "$dir/repo.json" "$dir/live.json" \
              > "$RUNNER_TEMP/drift.out" 2> "$RUNNER_TEMP/drift.err" || rc=$?
            tr -d '\r' < "$RUNNER_TEMP/drift.out" > "$RUNNER_TEMP/drift.got"

            if ! diff -u "$RUNNER_TEMP/drift.want" "$RUNNER_TEMP/drift.got"; then
              echo "::error::$name: output differs from $exp (diff above)"; exit 1
            fi
            if [ "$rc" -ne "$want" ]; then
              echo "::error::$name: exit code $rc, expected $want"; exit 1
            fi
            # stdout AND stderr: a leak on either is a leak.
            if grep -q SENTINEL "$RUNNER_TEMP/drift.out" "$RUNNER_TEMP/drift.err"; then
              echo "::error::$name: a live value (SENTINEL) reached the output"; exit 1
            fi
            echo "  ok - $name (exit $rc)"
          done

          # A glob that matches nothing would loop zero times and pass.
          if [ "$n" -eq 0 ]; then
            echo "::error::no fixtures found under $fx - refusing to report a false clean pass"; exit 1
          fi
          # The sentinel assertion above is vacuous if the fixture stopped
          # holding one, so pin that too.
          grep -q SENTINEL "$fx/sentinel-never-printed/live.json" || {
            echo "::error::sentinel-never-printed/live.json no longer holds a SENTINEL value - the never-print check proves nothing"; exit 1
          }
          echo "  ok - $n fixtures"
      - name: Without jq the script says so and exits 2
        run: |
          # CLAUDE_WORKFLOW_JQ is the seam: the runner ships jq, so removing it
          # from PATH is not an option. Exact line and exit 2, both asserted.
          fx=scripts/settings-drift-fixtures/clean
          rc=0
          out=$(CLAUDE_WORKFLOW_JQ=/nonexistent sh scripts/settings-drift.sh "$fx/repo.json" "$fx/live.json" 2>&1) || rc=$?
          [ "$out" = 'settings drift: not checked - jq not found' ] || {
            echo "::error::jq-absent output was not the exact not-checked line"; printf '%s\n' "$out"; exit 1
          }
          [ "$rc" -eq 2 ] || { echo "::error::jq-absent exit code $rc, expected 2"; exit 1; }
          echo "  ok - jq absent: exact line, exit 2"
      - name: A failing comparison pass says so, exits 2 and leaks no jq stderr
        run: |
          # No fixture can reach the "comparison failed" mapping: every input the
          # earlier guards let through also compares cleanly. So a shim stands in
          # for jq via CLAUDE_WORKFLOW_JQ: it forwards to the real jq, except that
          # it fails on the THIRD call only (settings-drift.sh calls jq three
          # times, in order: repo info, live info, comparison) and writes a
          # recognisable string to stderr. Catches two mutants:
          #   - `|| not_checked 'comparison failed'` removed or changed: the
          #     exact-line and exit-code assertions fail;
          #   - `2>/dev/null` removed from the comparison call: the shim string
          #     reaches the output and the stderr assertion fails.
          # settings-drift.ps1's equivalent catch block is unreachable from file
          # inputs, so it is covered by review, not CI.
          real_jq=$(command -v jq)
          shim="$RUNNER_TEMP/jq-shim.sh"
          count="$RUNNER_TEMP/jq-shim.count"
          rm -f "$count"
          cat > "$shim" <<EOF
          #!/bin/sh
          echo x >> "$count"
          if [ "\$(wc -l < "$count")" -eq 3 ]; then
            echo SHIM-STDERR-9c1e >&2
            exit 5
          fi
          exec "$real_jq" "\$@"
          EOF
          chmod +x "$shim"
          fx=scripts/settings-drift-fixtures/clean
          rc=0
          CLAUDE_WORKFLOW_JQ="$shim" sh scripts/settings-drift.sh "$fx/repo.json" "$fx/live.json" \
            > "$RUNNER_TEMP/shim.out" 2> "$RUNNER_TEMP/shim.err" || rc=$?
          out=$(cat "$RUNNER_TEMP/shim.out")
          [ "$out" = 'settings drift: not checked - comparison failed' ] || {
            echo "::error::failed-comparison output was not the exact not-checked line"; printf '%s\n' "$out"; exit 1
          }
          [ "$rc" -eq 2 ] || { echo "::error::failed-comparison exit code $rc, expected 2"; exit 1; }
          # stdout AND stderr: the shim's string must reach neither.
          if grep -qF SHIM-STDERR-9c1e "$RUNNER_TEMP/shim.out" "$RUNNER_TEMP/shim.err"; then
            echo "::error::jq stderr leaked out of a failed comparison"; exit 1
          fi
          [ "$(wc -l < "$count")" -eq 3 ] || {
            echo "::error::shim was called $(wc -l < "$count") times, expected 3 - the call-count assumption no longer holds"; exit 1
          }
          echo "  ok - failed comparison: exact line, exit 2, stderr discarded"
      - name: Wrong argument count prints usage and exits 2
        run: |
          for args in '' 'a' 'a b c'; do
            # shellcheck disable=SC2086 # deliberate word splitting: '' means no args
            rc=0
            out=$(sh scripts/settings-drift.sh $args 2>&1) || rc=$?
            printf '%s\n' "$out" | grep -qF 'usage: settings-drift.sh' || {
              echo "::error::no usage message with [$args]"; printf '%s\n' "$out"; exit 1
            }
            [ "$rc" -eq 2 ] || { echo "::error::usage exit code $rc with [$args], expected 2"; exit 1; }
          done
          echo "  ok - wrong argument count prints usage, exit 2"
      - name: install.sh --dry-run reports drift, stays read-only, and finishes
        run: |
          # HOME under $RUNNER_TEMP: the installer must never see the runner's
          # real ~/.claude. The live file is a REAL file missing exactly one
          # repo deny rule, so the skip branch and the drift report both fire.
          fh="$RUNNER_TEMP/drift-home"
          rm -rf "$fh"; mkdir -p "$fh/.claude"
          grep -vxF '      "Read(.env)",' settings.json > "$fh/.claude/settings.json"
          if cmp -s settings.json "$fh/.claude/settings.json"; then
            echo "::error::the wiring fixture is not missing a rule - settings.json no longer has the expected Read(.env) line"; exit 1
          fi
          before=$(sha256sum "$fh/.claude/settings.json")
          find "$fh" | sort > "$RUNNER_TEMP/drift-tree.before"

          # Runs the installer against the scratch HOME, shows its output, keeps
          # it for the assertions and requires exit 0. `|| rc=$?` keeps a
          # failure from aborting under `bash -e` before the message is printed.
          run_install() {
            local rc=0
            HOME="$fh" bash install.sh "$@" > "$RUNNER_TEMP/drift-install.out" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/drift-install.out"
            [ "$rc" -eq 0 ] || { echo "::error::${kind:+$kind: }install.sh${*:+ $*} exited $rc"; exit 1; }
          }
          run_install --dry-run

          # Exit 0 (run_install) AND the later sections AND the final line: a
          # drift script that aborted the installer half-way (set -e on its
          # exit 1) would fail here on any one of them.
          for want in \
            '  settings drift: missing ["permissions","deny"] "Read(.env)"' \
            'agents:' \
            'skills:' \
            'Done. Restart Claude Code to pick up changes.'
          do
            grep -qxF "$want" "$RUNNER_TEMP/drift-install.out" || {
              echo "::error::installer output lacks the line: $want"; exit 1
            }
          done

          # Read-only: a dry run neither edits the live file nor creates
          # anything (it used to mkdir skills/ and agents/ first).
          after=$(sha256sum "$fh/.claude/settings.json")
          [ "$before" = "$after" ] || { echo "::error::dry-run modified the live settings.json"; exit 1; }
          find "$fh" | sort > "$RUNNER_TEMP/drift-tree.after"
          diff -u "$RUNNER_TEMP/drift-tree.before" "$RUNNER_TEMP/drift-tree.after" || {
            echo "::error::dry-run created or removed entries under the fake ~/.claude"; exit 1
          }
          echo "  ok - dry-run: drift line, later sections, final line, nothing written"
      - name: install.sh leaves a settings.json symlink to elsewhere alone
        run: |
          # Before the fix such a link (e.g. into a dotfiles repo) was silently
          # re-pointed at the repo, swapping the user's live permission rules
          # with no backup. A normal (non-dry-run) install, because that is
          # where it bit.
          fh="$RUNNER_TEMP/drift-home-link"
          dot="$RUNNER_TEMP/drift-dotfiles"
          rm -rf "$fh" "$dot"; mkdir -p "$fh/.claude" "$dot"
          grep -vxF '      "Read(.env)",' settings.json > "$dot/settings.json"
          ln -s "$dot/settings.json" "$fh/.claude/settings.json"
          before=$(sha256sum "$dot/settings.json")

          # Runs the installer against the scratch HOME, shows its output, keeps
          # it for the assertions and requires exit 0. `|| rc=$?` keeps a
          # failure from aborting under `bash -e` before the message is printed.
          run_install() {
            local rc=0
            HOME="$fh" bash install.sh "$@" > "$RUNNER_TEMP/drift-install.out" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/drift-install.out"
            [ "$rc" -eq 0 ] || { echo "::error::${kind:+$kind: }install.sh${*:+ $*} exited $rc"; exit 1; }
          }
          run_install

          for want in \
            'links elsewhere and is left as is' \
            '  settings drift: missing ["permissions","deny"] "Read(.env)"' \
            'Done. Restart Claude Code to pick up changes.'
          do
            grep -qF "$want" "$RUNNER_TEMP/drift-install.out" || {
              echo "::error::installer output lacks: $want"; exit 1
            }
          done
          # The link still points where the user put it, its target is
          # untouched, and no backup was made (there was nothing to displace).
          [ "$(readlink "$fh/.claude/settings.json")" = "$dot/settings.json" ] || {
            echo "::error::the foreign settings.json symlink was re-pointed"; exit 1
          }
          [ "$before" = "$(sha256sum "$dot/settings.json")" ] || {
            echo "::error::the symlink target was modified"; exit 1
          }
          if ls "$fh/.claude"/settings.json.backup.* >/dev/null 2>&1; then
            echo "::error::a backup of the foreign symlink was made"; exit 1
          fi
          echo "  ok - foreign symlink: skipped, drift reported, target untouched"
      - name: install.sh treats a hard-linked settings.json as a real file
        run: |
          # Parity with the Windows step of the same case: a real file with a
          # link count above 1 is still real data. install.sh tests with -L, so
          # this should always pass; it pins that. The PowerShell twin is where
          # a HardLink-as-link mutant bit.
          fh="$RUNNER_TEMP/drift-home-hardlink"
          rm -rf "$fh"; mkdir -p "$fh/.claude"
          grep -vxF '      "Read(.env)",' settings.json > "$fh/.claude/settings.json"
          ln "$fh/.claude/settings.json" "$fh/other1.json"
          ln "$fh/.claude/settings.json" "$fh/other2.json"
          before=$(sha256sum "$fh/.claude/settings.json")
          rc=0
          HOME="$fh" bash install.sh > "$RUNNER_TEMP/drift-install.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/drift-install.out"
          [ "$rc" -eq 0 ] || { echo "::error::install.sh exited $rc"; exit 1; }
          for want in \
            'skip (real settings.json exists' \
            '  settings drift: missing ["permissions","deny"] "Read(.env)"'
          do
            grep -qF "$want" "$RUNNER_TEMP/drift-install.out" || {
              echo "::error::installer output lacks: $want"; exit 1
            }
          done
          [ -f "$fh/.claude/settings.json" ] && [ ! -L "$fh/.claude/settings.json" ] || {
            echo "::error::the hard-linked settings.json was replaced"; exit 1
          }
          [ "$before" = "$(sha256sum "$fh/.claude/settings.json")" ] || {
            echo "::error::the hard-linked settings.json was modified"; exit 1
          }
          if ls "$fh/.claude"/settings.json.backup.* >/dev/null 2>&1; then
            echo "::error::a backup of the hard-linked file was made"; exit 1
          fi
          echo "  ok - hard-linked real file: skipped, drift reported, file intact"
      - name: install.sh recognises its own settings.json link (absolute and relative)
        run: |
          # Ownership is decided by file identity, not by comparing link text.
          # Caught by this step: a readlink string compare (the relative link
          # would be judged foreign and skipped with a drift report) and a link()
          # that re-creates an already-correct link (the link text would change
          # or a backup appear). Each case asserts the printed line, that no
          # drift report ran (an own link is not a hand-merged file), and the
          # resulting link state.

          # Runs the installer against the scratch HOME, shows its output, keeps
          # it for the assertions and requires exit 0. `|| rc=$?` keeps a
          # failure from aborting under `bash -e` before the message is printed.
          run_install() {
            local rc=0
            HOME="$fh" bash install.sh "$@" > "$RUNNER_TEMP/drift-install.out" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/drift-install.out"
            [ "$rc" -eq 0 ] || { echo "::error::${kind:+$kind: }install.sh${*:+ $*} exited $rc"; exit 1; }
          }
          for kind in absolute relative; do
            fh="$RUNNER_TEMP/drift-home-own-$kind"
            rm -rf "$fh"; mkdir -p "$fh/.claude"
            if [ "$kind" = absolute ]; then
              want_link="$PWD/settings.json"
            else
              want_link=$(realpath --relative-to="$fh/.claude" "$PWD/settings.json")
            fi
            ln -s "$want_link" "$fh/.claude/settings.json"

            run_install

            grep -qxF '  ok (already linked): ~/.claude/settings.json' "$RUNNER_TEMP/drift-install.out" || {
              echo "::error::$kind: an own settings.json link was not recognised as already linked"; exit 1
            }
            if grep -qE 'settings drift|re-run after a git pull|links elsewhere' "$RUNNER_TEMP/drift-install.out"; then
              echo "::error::$kind: an own settings.json link got a foreign-link skip or a drift report"; exit 1
            fi
            [ "$(readlink "$fh/.claude/settings.json")" = "$want_link" ] || {
              echo "::error::$kind: the own link was re-created ($(readlink "$fh/.claude/settings.json"))"; exit 1
            }
            [ "$fh/.claude/settings.json" -ef settings.json ] || {
              echo "::error::$kind: the link no longer resolves to the repo settings.json"; exit 1
            }
            if ls "$fh/.claude"/settings.json.backup.* >/dev/null 2>&1; then
              echo "::error::$kind: a backup of an own link was made"; exit 1
            fi
            echo "  ok - own $kind link: recognised, no drift report, link untouched"
          done
      - name: install.sh backs up a dangling settings.json link and re-links
        run: |
          # A dangling link holds no data, but its target may be an unmounted
          # drive, so the link itself is kept (settings.json.backup.<stamp>) and
          # settings.json is linked to the repo. Caught by this step: the old
          # blind rm of a stale link (no backup), and the foreign-link rule
          # swallowing it (no re-link, so a drift report on a missing file).
          fh="$RUNNER_TEMP/drift-home-dangling"
          gone="$RUNNER_TEMP/drift-unmounted/settings.json"
          rm -rf "$fh" "$RUNNER_TEMP/drift-unmounted"; mkdir -p "$fh/.claude"
          ln -s "$gone" "$fh/.claude/settings.json"
          if [ -e "$fh/.claude/settings.json" ]; then
            echo "::error::the dangling fixture is not dangling"; exit 1
          fi

          # Runs the installer against the scratch HOME, shows its output, keeps
          # it for the assertions and requires exit 0. `|| rc=$?` keeps a
          # failure from aborting under `bash -e` before the message is printed.
          run_install() {
            local rc=0
            HOME="$fh" bash install.sh "$@" > "$RUNNER_TEMP/drift-install.out" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/drift-install.out"
            [ "$rc" -eq 0 ] || { echo "::error::${kind:+$kind: }install.sh${*:+ $*} exited $rc"; exit 1; }
          }
          run_install

          grep -qE '^  backed up dangling symlink -> settings\.json\.backup\.[0-9]+$' "$RUNNER_TEMP/drift-install.out" || {
            echo "::error::no 'backed up dangling symlink' line"; exit 1
          }
          grep -qE '^  linked: .*settings\.json -> .*settings\.json$' "$RUNNER_TEMP/drift-install.out" || {
            echo "::error::no 'linked:' line for settings.json"; exit 1
          }
          if grep -q 'settings drift' "$RUNNER_TEMP/drift-install.out"; then
            echo "::error::a dangling link got a drift report instead of being re-linked"; exit 1
          fi
          set -- "$fh/.claude"/settings.json.backup.*
          [ "$#" -eq 1 ] && [ -L "$1" ] || {
            echo "::error::expected exactly one backup and it to be a symlink (got $#)"; exit 1
          }
          [ "$(readlink "$1")" = "$gone" ] || {
            echo "::error::the backup does not point at the old target"; exit 1
          }
          [ -L "$fh/.claude/settings.json" ] && [ "$fh/.claude/settings.json" -ef settings.json ] || {
            echo "::error::settings.json is not now a link to the repo settings.json"; exit 1
          }
          echo "  ok - dangling link: backed up (still a link to the old target), re-linked"
      - name: install.sh --uninstall restores the dangling settings.json link
        run: |
          # Continues from the previous step's home: settings.json links to the
          # repo and the backup is a link to a missing target. Uninstall must
          # unlink ours and move the backup back as a link (still dangling).
          # Caught by this step: a restore that follows or drops the dangling
          # link (mv of a missing target treated as an error), and an uninstall
          # that leaves the slot empty.
          fh="$RUNNER_TEMP/drift-home-dangling"
          gone="$RUNNER_TEMP/drift-unmounted/settings.json"
          ls "$fh/.claude"/settings.json.backup.* >/dev/null 2>&1 || {
            echo "::error::no backup left over from the previous step"; exit 1
          }
          # Runs the installer against the scratch HOME, shows its output, keeps
          # it for the assertions and requires exit 0. `|| rc=$?` keeps a
          # failure from aborting under `bash -e` before the message is printed.
          run_install() {
            local rc=0
            HOME="$fh" bash install.sh "$@" > "$RUNNER_TEMP/drift-install.out" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/drift-install.out"
            [ "$rc" -eq 0 ] || { echo "::error::${kind:+$kind: }install.sh${*:+ $*} exited $rc"; exit 1; }
          }
          run_install --uninstall

          grep -qE '^  restored backup: settings\.json\.backup\.[0-9]+$' "$RUNNER_TEMP/drift-install.out" || {
            echo "::error::no 'restored backup' line for settings.json"; exit 1
          }
          [ -L "$fh/.claude/settings.json" ] && [ "$(readlink "$fh/.claude/settings.json")" = "$gone" ] || {
            echo "::error::settings.json is not restored as a link to the old target"; exit 1
          }
          [ ! -e "$fh/.claude/settings.json" ] || {
            echo "::error::the restored link is not dangling"; exit 1
          }
          if ls "$fh/.claude"/settings.json.backup.* >/dev/null 2>&1; then
            echo "::error::the backup is still there after being restored"; exit 1
          fi
          echo "  ok - uninstall: dangling link restored from its backup"

  settings-drift-windows:
    name: settings-drift.ps1 (${{ matrix.shell }}) + install.ps1 wiring
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # `powershell` is Windows PowerShell 5.1, `pwsh` is PowerShell 7. The
        # script must behave identically under both (ConvertTo-Json differs
        # between them, which is why it carries its own encoder), and pwsh on
        # Linux would not test 5.1 at all - hence a Windows runner.
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      MATRIX_SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          # As in the ubuntu job: nothing pushes.
          persist-credentials: false
      - name: Confirm the step really runs under the shell being tested
        run: |
          $v = $PSVersionTable.PSVersion
          Write-Host "PowerShell $v ($env:MATRIX_SHELL)"
          if ($env:MATRIX_SHELL -eq 'powershell' -and $v.Major -ne 5) { Write-Host "::error::expected Windows PowerShell 5.x, got $v"; exit 1 }
          if ($env:MATRIX_SHELL -eq 'pwsh' -and $v.Major -lt 7) { Write-Host "::error::expected PowerShell 7+, got $v"; exit 1 }
          exit 0
      - name: Every fixture must print exactly its expected output
        run: |
          # The same fixtures and assertions as the ubuntu job: exact output
          # (CR stripped), the exit code implied by that output, and no
          # SENTINEL on stdout or stderr. The script runs as a child of the
          # shell under test, which gives a true exit code and exercises the
          # -File form the installer's re-run hint prints.
          # GitHub prepends $ErrorActionPreference = 'stop', which turns native
          # stderr redirection into a terminating error under 5.1.
          $ErrorActionPreference = 'Continue'
          $exe = (Get-Process -Id $PID).Path
          $fx = 'scripts/settings-drift-fixtures'
          $clean = 'settings: no repo setting missing or different (live-only settings not checked)'
          $err = Join-Path $env:RUNNER_TEMP 'drift.err'
          $n = 0
          foreach ($dir in @(Get-ChildItem -LiteralPath $fx -Directory | Sort-Object Name)) {
            $name = $dir.Name
            $n++
            # expected.ps.txt where the message names the tool (PowerShell).
            $exp = Join-Path $dir.FullName 'expected.txt'
            if (-not (Test-Path -LiteralPath $exp)) { $exp = Join-Path $dir.FullName 'expected.ps.txt' }
            if (-not (Test-Path -LiteralPath $exp)) { Write-Host "::error::${name}: no expected.txt or expected.ps.txt"; exit 1 }
            $want = (Get-Content -Raw -LiteralPath $exp) -replace "`r", ''

            # Exit code implied by the expected output (fixtures README).
            if ($want -ceq ($clean + "`n")) { $wantRc = 0 }
            elseif ($want -cmatch '(?m)^settings drift: (missing|differs) ') { $wantRc = 1 }
            elseif ($want -cmatch '(?m)^settings drift: not checked') { $wantRc = 2 }
            else { Write-Host "::error::${name}: cannot derive an exit code from $exp"; exit 1 }

            $lines = @(& $exe -NoProfile -File scripts/settings-drift.ps1 -Repo (Join-Path $dir.FullName 'repo.json') -Live (Join-Path $dir.FullName 'live.json') 2>$err)
            $rc = $LASTEXITCODE
            $got = (($lines | ForEach-Object { "$_" -replace "`r", '' }) -join "`n") + "`n"
            # A missing or empty stderr file reads as nothing (or $null); "$()" makes it ''.
            $errText = "$(Get-Content -Raw -LiteralPath $err -ErrorAction SilentlyContinue)"

            if ($got -cne $want) {
              Write-Host "--- expected ($exp)"; Write-Host $want
              Write-Host "--- got"; Write-Host $got
              Write-Host "::error::${name}: output differs from $exp"; exit 1
            }
            if ($rc -ne $wantRc) { Write-Host "::error::${name}: exit code $rc, expected $wantRc"; exit 1 }
            if ($got.Contains('SENTINEL') -or $errText.Contains('SENTINEL')) {
              Write-Host "::error::${name}: a live value (SENTINEL) reached the output"; exit 1
            }
            Write-Host "  ok - $name (exit $rc)"
          }
          if ($n -eq 0) { Write-Host "::error::no fixtures found under $fx - refusing to report a false clean pass"; exit 1 }
          if (-not (Select-String -LiteralPath "$fx/sentinel-never-printed/live.json" -Pattern 'SENTINEL' -Quiet)) {
            Write-Host "::error::sentinel-never-printed/live.json no longer holds a SENTINEL value - the never-print check proves nothing"; exit 1
          }
          Write-Host "  ok - $n fixtures"
          exit 0
      - name: Wrong arguments print usage and exit 2
        run: |
          # Two cases: a missing -Live, and a stray extra argument (which used
          # to be accepted silently). Deleting either guard fails its own case.
          $ErrorActionPreference = 'Continue'
          $exe = (Get-Process -Id $PID).Path
          foreach ($case in @(@('-Repo', 'only-one'), @('-Repo', 'a', '-Live', 'b', 'extra'))) {
            $label = $case -join ' '
            $out = @(& $exe -NoProfile -File scripts/settings-drift.ps1 @case 2>&1) | Out-String
            $rc = $LASTEXITCODE
            if (-not $out.Contains('usage:')) { Write-Host $out; Write-Host "::error::no usage message with [$label]"; exit 1 }
            if ($rc -ne 2) { Write-Host "::error::usage exit code $rc with [$label], expected 2"; exit 1 }
            Write-Host "  ok - [$label] prints usage, exit 2"
          }
          exit 0
      - name: install.ps1 -DryRun reports drift, stays read-only, and finishes
        run: |
          # USERPROFILE under RUNNER_TEMP: the installer must never see the
          # runner's real .claude. Same assertions as install.sh --dry-run.
          # -DryRun exits 0: install.ps1's only non-zero exit is the
          # deferred-symlink case, and a dry run defers nothing.
          $ErrorActionPreference = 'Continue'
          $exe = (Get-Process -Id $PID).Path
          $fh = Join-Path $env:RUNNER_TEMP 'drift-home'
          if (Test-Path -LiteralPath $fh) { Remove-Item -Recurse -Force -LiteralPath $fh }
          New-Item -ItemType Directory -Force -Path (Join-Path $fh '.claude') | Out-Null
          $live = Join-Path $fh '.claude\settings.json'
          $repoLines = @((Get-Content -Raw -LiteralPath settings.json) -split "`r?`n")
          $liveLines = @($repoLines | Where-Object { $_.Trim() -cne '"Read(.env)",' })
          if ($liveLines.Count -ne $repoLines.Count - 1) {
            Write-Host "::error::the wiring fixture is not missing exactly one rule - settings.json no longer has the expected Read(.env) line"; exit 1
          }
          [System.IO.File]::WriteAllText($live, ($liveLines -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          $before = (Get-FileHash -LiteralPath $live -Algorithm SHA256).Hash
          # Snapshot .claude only: PowerShell itself creates AppData\Roaming under a
          # redirected USERPROFILE, which says nothing about the installer.
          $treeBefore = @(Get-ChildItem -LiteralPath (Join-Path $fh '.claude') -Recurse -Force | ForEach-Object { $_.FullName }) -join "`n"

          $env:USERPROFILE = $fh
          $out = @(& $exe -NoProfile -File .\install.ps1 -DryRun 2>&1 | ForEach-Object { "$_" -replace "`r", '' })
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }

          if ($rc -ne 0) { Write-Host "::error::install.ps1 -DryRun exited $rc"; exit 1 }
          foreach ($want in @(
              '  settings drift: missing ["permissions","deny"] "Read(.env)"',
              'agents:',
              'skills:',
              'Done. Restart Claude Code to pick up changes.')) {
            if ($out -cnotcontains $want) { Write-Host "::error::installer output lacks the line: $want"; exit 1 }
          }
          if ((Get-FileHash -LiteralPath $live -Algorithm SHA256).Hash -ne $before) {
            Write-Host "::error::dry-run modified the live settings.json"; exit 1
          }
          $treeAfter = @(Get-ChildItem -LiteralPath (Join-Path $fh '.claude') -Recurse -Force | ForEach-Object { $_.FullName }) -join "`n"
          if ($treeAfter -cne $treeBefore) {
            Write-Host "::error::dry-run created or removed entries under the fake .claude"; exit 1
          }
          Write-Host "  ok - dry-run: drift line, later sections, final line, nothing written"
          exit 0
      - name: install.ps1 settings.json link cases (own, foreign, dangling)
        run: |
          # The non-dry-run link branch, both shells in the matrix. windows-latest
          # runs elevated, so New-Item can create the symlinks these cases need
          # (they cannot be made on an unelevated dev box). Ownership is by
          # resolved path, so the own case is tried absolute and relative.
          # Caught here: a string compare (relative link judged foreign), the
          # old blind delete of a stale link (no backup), the foreign-link rule
          # swallowing a dangling one, and a foreign link being re-pointed.
          $ErrorActionPreference = 'Continue'
          $exe = (Get-Process -Id $PID).Path
          $repoSettings = (Resolve-Path -LiteralPath settings.json).Path
          $tmp = $env:RUNNER_TEMP
          # The installer's Info lines are plain ASCII, but a native child's
          # stdout is decoded with the console's OEM code page; pin UTF-8 so a
          # non-ASCII path in the output cannot break the exact-line matches.
          [Console]::OutputEncoding = [Text.Encoding]::UTF8

          function New-Home($name) {
            $fh = Join-Path $tmp $name
            if (Test-Path -LiteralPath $fh) { Remove-Item -Recurse -Force -LiteralPath $fh }
            New-Item -ItemType Directory -Force -Path (Join-Path $fh '.claude') | Out-Null
            return $fh
          }
          function Invoke-Install($fh, [switch]$Uninstall) {
            $env:USERPROFILE = $fh
            $extra = @(); if ($Uninstall) { $extra = @('-Uninstall') }
            $o = @(& $exe -NoProfile -File .\install.ps1 @extra 2>&1 | ForEach-Object { "$_" -replace "`r", '' })
            $o | ForEach-Object { Write-Host $_ }
            return [pscustomobject]@{ Out = $o; Rc = $LASTEXITCODE }
          }
          function Get-LinkText($path) {
            $item = Get-Item -LiteralPath $path -Force
            if ($item.LinkType -ne 'SymbolicLink') { return $null }
            return ($item.Target -join '')
          }
          function Get-Backups($fh) {
            return @(Get-ChildItem -Path (Join-Path $fh '.claude\settings.json.backup.*') -Force -ErrorAction SilentlyContinue)
          }

          # -- own link, absolute and relative
          foreach ($kind in 'absolute', 'relative') {
            $fh = New-Home "drift-home-own-$kind"
            $link = Join-Path $fh '.claude\settings.json'
            if ($kind -eq 'absolute') { $wantLink = $repoSettings }
            else {
              $from = New-Object System.Uri ((Join-Path $fh '.claude') + '\')
              $wantLink = [System.Uri]::UnescapeDataString($from.MakeRelativeUri((New-Object System.Uri $repoSettings)).ToString()) -replace '/', '\'
            }
            # mklink stores relative text as given; New-Item may resolve it against the cwd.
            if ($kind -eq 'absolute') { New-Item -ItemType SymbolicLink -Path $link -Value $wantLink | Out-Null }
            else { cmd /c "mklink ""$link"" ""$wantLink"" >nul" }
            if ((Get-LinkText $link) -cne $wantLink) { Write-Host "::error::$($kind): the fixture link was not created as intended"; exit 1 }
            $r = Invoke-Install $fh
            if ($r.Rc -ne 0) { Write-Host "::error::$($kind): install.ps1 exited $($r.Rc)"; exit 1 }
            if ($r.Out -cnotcontains "  ok (already linked): $link") { Write-Host "::error::$($kind): an own settings.json link was not recognised as already linked"; exit 1 }
            if (@($r.Out | Where-Object { $_ -cmatch 'settings drift|re-run after a git pull|links elsewhere' }).Count -gt 0) {
              Write-Host "::error::$($kind): an own settings.json link got a foreign-link skip or a drift report"; exit 1
            }
            if ((Get-LinkText $link) -cne $wantLink) { Write-Host "::error::$($kind): the own link was re-created ($(Get-LinkText $link))"; exit 1 }
            if ((Get-Backups $fh).Count -ne 0) { Write-Host "::error::$($kind): a backup of an own link was made"; exit 1 }
            Write-Host "  ok - own $kind link: recognised, no drift report, link untouched"
          }

          # -- foreign link
          $fh = New-Home 'drift-home-foreign'
          $link = Join-Path $fh '.claude\settings.json'
          $dot = Join-Path $tmp 'drift-dotfiles-ps'
          New-Item -ItemType Directory -Force -Path $dot | Out-Null
          $repoLines = @((Get-Content -Raw -LiteralPath settings.json) -split "`r?`n")
          $dotLines = @($repoLines | Where-Object { $_.Trim() -cne '"Read(.env)",' })
          if ($dotLines.Count -ne $repoLines.Count - 1) { Write-Host "::error::the foreign fixture is not missing exactly one rule"; exit 1 }
          $dotFile = Join-Path $dot 'settings.json'
          [System.IO.File]::WriteAllText($dotFile, ($dotLines -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          $dotHash = (Get-FileHash -LiteralPath $dotFile -Algorithm SHA256).Hash
          New-Item -ItemType SymbolicLink -Path $link -Value $dotFile | Out-Null
          $r = Invoke-Install $fh
          if ($r.Rc -ne 0) { Write-Host "::error::foreign: install.ps1 exited $($r.Rc)"; exit 1 }
          if (@($r.Out | Where-Object { $_.Contains('links elsewhere and is left as is') }).Count -eq 0) { Write-Host "::error::foreign: no 'links elsewhere' line"; exit 1 }
          if ($r.Out -cnotcontains '  settings drift: missing ["permissions","deny"] "Read(.env)"') { Write-Host "::error::foreign: no drift line"; exit 1 }
          if ($r.Out -cnotcontains 'Done. Restart Claude Code to pick up changes.') { Write-Host "::error::foreign: installer did not finish"; exit 1 }
          if ((Get-LinkText $link) -cne $dotFile) { Write-Host "::error::foreign: the symlink was re-pointed"; exit 1 }
          if ((Get-FileHash -LiteralPath $dotFile -Algorithm SHA256).Hash -ne $dotHash) { Write-Host "::error::foreign: the link target was modified"; exit 1 }
          if ((Get-Backups $fh).Count -ne 0) { Write-Host "::error::foreign: a backup of the foreign link was made"; exit 1 }
          Write-Host "  ok - foreign link: skipped, drift reported, target untouched"

          # -- dangling link
          $fh = New-Home 'drift-home-dangling'
          $link = Join-Path $fh '.claude\settings.json'
          $gone = Join-Path $tmp 'drift-unmounted-ps\settings.json'
          # mklink (elevated runner) rather than New-Item, which may resolve or
          # reject a missing target; then prove the fixture is what it claims to
          # be before the installer sees it: a reparse point whose text is the
          # missing target. A fixture that silently was not created dangling
          # would let the dangling branch go untested while the step stays green.
          cmd /c "mklink ""$link"" ""$gone"" >nul"
          $attrs = [System.IO.File]::GetAttributes($link)
          if (-not ($attrs -band [System.IO.FileAttributes]::ReparsePoint)) { Write-Host "::error::the dangling fixture is not a reparse point"; exit 1 }
          if ((Get-LinkText $link) -cne $gone) { Write-Host "::error::the dangling fixture does not hold the missing target's path"; exit 1 }
          if (Test-Path -LiteralPath $gone) { Write-Host "::error::the dangling fixture's target exists"; exit 1 }
          $r = Invoke-Install $fh
          if ($r.Rc -ne 0) { Write-Host "::error::dangling: install.ps1 exited $($r.Rc)"; exit 1 }
          if (@($r.Out | Where-Object { $_ -cmatch '^  backed up dangling symlink -> settings\.json\.backup\.\d+$' }).Count -ne 1) { Write-Host "::error::dangling: no 'backed up dangling symlink' line"; exit 1 }
          if (@($r.Out | Where-Object { $_ -cmatch 'settings drift' }).Count -gt 0) { Write-Host "::error::dangling: got a drift report instead of being re-linked"; exit 1 }
          $backups = Get-Backups $fh
          if ($backups.Count -ne 1) { Write-Host "::error::dangling: expected exactly one backup, got $($backups.Count)"; exit 1 }
          if ((Get-LinkText $backups[0].FullName) -cne $gone) { Write-Host "::error::dangling: the backup is not a symlink to the old target"; exit 1 }
          if ((Get-LinkText $link) -ine $repoSettings) { Write-Host "::error::dangling: settings.json does not now link to the repo settings.json"; exit 1 }
          Write-Host "  ok - dangling link: backed up (still a link to the old target), re-linked"

          # -- uninstall over that state: settings.json links to the repo, the
          # backup is a link to the missing target. The restore must rename the
          # backup as a link (Move-Item would try to resolve the missing target
          # and fail). Caught here: that Move-Item restore, and an uninstall
          # that leaves the slot empty.
          $r = Invoke-Install $fh -Uninstall
          if ($r.Rc -ne 0) { Write-Host "::error::dangling uninstall: install.ps1 -Uninstall exited $($r.Rc)"; exit 1 }
          if (@($r.Out | Where-Object { $_ -cmatch '^  restored backup: settings\.json\.backup\.\d+$' }).Count -ne 1) { Write-Host "::error::dangling uninstall: no 'restored backup' line for settings.json"; exit 1 }
          if (-not ([System.IO.File]::GetAttributes($link) -band [System.IO.FileAttributes]::ReparsePoint)) { Write-Host "::error::dangling uninstall: settings.json is not a link after the restore"; exit 1 }
          if ((Get-LinkText $link) -cne $gone) { Write-Host "::error::dangling uninstall: settings.json is not restored as a link to the old target"; exit 1 }
          if (Test-Path -LiteralPath $gone) { Write-Host "::error::dangling uninstall: the old target exists"; exit 1 }
          if ((Get-Backups $fh).Count -ne 0) { Write-Host "::error::dangling uninstall: the backup is still there after being restored"; exit 1 }
          Write-Host "  ok - uninstall: dangling link restored from its backup"

          # -- hard-linked real file. LinkType reports HardLink for any file with
          # a link count above 1, and .Target then lists the OTHER names. Caught
          # here: Get-LinkTarget accepting HardLink - with two other names the
          # joined names resolve to nothing, so the real file read as dangling
          # and was deleted with no backup; with one it read as a foreign link.
          $fh = New-Home 'drift-home-hardlink'
          $link = Join-Path $fh '.claude\settings.json'
          $repoLines = @((Get-Content -Raw -LiteralPath settings.json) -split "`r?`n")
          $hlLines = @($repoLines | Where-Object { $_.Trim() -cne '"Read(.env)",' })
          if ($hlLines.Count -ne $repoLines.Count - 1) { Write-Host "::error::hardlink: the fixture is not missing exactly one rule"; exit 1 }
          [System.IO.File]::WriteAllText($link, ($hlLines -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          New-Item -ItemType HardLink -Path (Join-Path $fh 'other1.json') -Value $link | Out-Null
          New-Item -ItemType HardLink -Path (Join-Path $fh 'other2.json') -Value $link | Out-Null
          $hlHash = (Get-FileHash -LiteralPath $link -Algorithm SHA256).Hash
          $r = Invoke-Install $fh
          if ($r.Rc -ne 0) { Write-Host "::error::hardlink: install.ps1 exited $($r.Rc)"; exit 1 }
          if (@($r.Out | Where-Object { $_.Contains('skip (real settings.json exists') }).Count -eq 0) { Write-Host "::error::hardlink: no 'real settings.json exists' line"; exit 1 }
          if ($r.Out -cnotcontains '  settings drift: missing ["permissions","deny"] "Read(.env)"') { Write-Host "::error::hardlink: no drift line"; exit 1 }
          if (-not (Test-Path -LiteralPath $link)) { Write-Host "::error::hardlink: the hard-linked settings.json was deleted"; exit 1 }
          if ((Get-FileHash -LiteralPath $link -Algorithm SHA256).Hash -ne $hlHash) { Write-Host "::error::hardlink: settings.json content changed"; exit 1 }
          if ((Get-Backups $fh).Count -ne 0) { Write-Host "::error::hardlink: a backup was made"; exit 1 }
          Write-Host "  ok - hard-linked real file: skipped, drift reported, file intact"
          exit 0
