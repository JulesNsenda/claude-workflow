name: CI

on:
  push:
    branches: [main]
    # Tags, so version-guard's real check can fire on the tag itself; without
    # this the job would only ever run its own fixtures and never see a live
    # tag.
    #
    # Deliberately '*' and not 'v*'. The filter is the real gate on which tags
    # get checked, and a 'v*' filter means `git tag 1.1.0` runs NO workflow at
    # all — the guard silently absent at exactly the moment it exists for, with
    # no red build to show it. Matching every tag lets version-check.sh's own
    # shape check reject a non-`v` tag loudly instead.
    #
    # NOTE: every job in this file now also runs on tag pushes, against the
    # detached HEAD `actions/checkout` produces. All six are ref-agnostic today
    # (ref-check.sh reads the git index; the leak blocklist secret is available
    # on same-repo tag pushes). Anything added later that assumes a branch —
    # `github.ref_name` used as a branch name, a docs deploy, a `contents:
    # write` step — must account for that.
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  leak-check:
    name: Leak guard (no private strings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep tracked files against the private blocklist
        env:
          # One extended regex per line. Lives in repo settings, NOT in the
          # tree — the blocklist names exactly what must never appear here.
          # Absent on forks/PRs without secrets: the job skips (fail-open for
          # outsiders; the owner's pushes are the vector that matters).
          BLOCKLIST: ${{ secrets.LEAK_BLOCKLIST }}
        run: |
          if [ -z "$BLOCKLIST" ]; then
            echo "::notice::LEAK_BLOCKLIST secret not set - leak guard skipped. Set it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          printf '%s\n' "$BLOCKLIST" > "$RUNNER_TEMP/blocklist.txt"
          bash scripts/leak-check.sh "$RUNNER_TEMP/blocklist.txt"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck install.sh scripts/leak-check.sh scripts/run-stats.sh scripts/ref-check.sh scripts/version-check.sh

  run-stats:
    name: run-stats.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the canonical format fixture
        run: |
          # docs/ is gitignored, so CI never has real plan files. The tracked
          # example doubles as the fixture: if its keys drift from the parser,
          # this fails instead of the drift going unnoticed. Use a dedicated
          # directory — never $RUNNER_TEMP itself, which holds the leak
          # blocklist in the job above.
          fixture="$RUNNER_TEMP/plans-fixture"
          mkdir -p "$fixture"
          cp scripts/run-stats.example.md "$fixture/"
          out=$(bash scripts/run-stats.sh "$fixture")
          echo "$out"
          # Assert computed values, not boilerplate: a key rename in either the
          # fixture or the parser changes these numbers or trips a warning.
          echo "$out" | grep -q '^Ratios over 1 complete run(s)\.$' \
            || { echo "::error::fixture did not yield one complete run"; exit 1; }
          echo "$out" | grep -q '^Actioned findings + escapes: 14 ' \
            || { echo "::error::arithmetic changed — expected a denominator of 14"; exit 1; }
          echo "$out" | grep -q 'escaped both passes      7.1%' \
            || { echo "::error::escape rate changed — expected 7.1%"; exit 1; }
          # Any of these lines means a key the parser wanted was missing or
          # unusable — i.e. the format doc and the parser have drifted.
          if echo "$out" | grep -qE '^(skipped:|[0-9]+ counter|[0-9]+ run\(s\) excluded)'; then
            echo "::error::fixture keys drifted from the parser allowlist"; exit 1
          fi
      - name: Handle the empty case without dying
        run: |
          empty="$RUNNER_TEMP/plans-empty"
          mkdir -p "$empty"
          bash scripts/run-stats.sh "$empty" | grep -q 'nothing to aggregate' \
            || { echo "::error::empty directory not handled"; exit 1; }

  ref-check:
    name: ref-check.sh (docs ↔ agents/skills)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The repo's own references must resolve
        # Invoked as `sh`, not `bash`, so the POSIX constraint is exercised
        # rather than merely linted.
        run: sh scripts/ref-check.sh
      - name: Prove every check can fail, one fixture each
        run: |
          # A checker that quietly matches nothing exits 0 forever and reads as
          # green — worse than no checker. So each of the four checks gets its
          # own broken fixture, and each assertion greps for THAT check's
          # message rather than only the exit status: asserting exit status
          # alone lets three of the four checks be deleted with the job still
          # green (measured). This mirrors the run-stats job, which likewise
          # asserts computed output rather than a bare exit code.
          #
          # REF_CHECK_ALLOW_UNTRACKED=1 is required because the fixtures are not
          # git repos; the checker otherwise refuses to enumerate untracked
          # files, which is what stops it reading a private ~/.claude tree.
          fx="$RUNNER_TEMP/ref-fixture"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_fail() { # $1 = message substring, $2 = label
            if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$2: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$1" || {
              echo "::error::$2: expected message not found: $1"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $2"
          }

          build_good
          REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" \
            || { echo "::error::good fixture should pass but did not"; exit 1; }
          echo "  ok — good fixture passes"

          # check 1 — frontmatter name no longer matches its filename
          build_good
          printf -- '---\nname: wrong-name\n---\nbody\n' > "$fx/agents/demo-critic.md"
          expect_fail 'does not match filename' 'check 1 (frontmatter vs filename)'

          # check 2 Rule A — dangling hyphenated reference
          build_good
          printf 'The `demo-critic` agent, `demo-skill` skill, `nonexistent-critic`.\n' > "$fx/CLAUDE.md"
          expect_fail 'unresolved reference' 'check 2 Rule A (hyphenated name)'

          # check 2 Rule B — not hyphenated; caught only by the role word,
          # across a bold marker, which is the reflow that defeats naive matching
          build_good
          printf 'The `demo-critic` agent, `demo-skill` skill, **`ghostagent`** subagent.\n' > "$fx/CLAUDE.md"
          expect_fail 'unresolved reference' 'check 2 Rule B (role word after bold span)'

          # check 3 — an agent that exists but nothing references
          build_good
          printf -- '---\nname: orphan-agent\n---\nbody\n' > "$fx/agents/orphan-agent.md"
          expect_fail 'is never referenced' 'check 3 (orphaned definition)'

          # check 4 — a README link whose target does not exist
          build_good
          printf '# R\n\n[c](./agents/demo-critic.md) [x](./missing.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          expect_fail 'does not exist' 'check 4 (dangling README link)'
      - name: A fence closes only with the marker that opened it
        run: |
          # A ~~~ line inside a ``` block must not close it. If it does, the
          # rest of the block is tokenized and every backticked example in a
          # code block becomes a build failure. Asserting the CLEAN case is
          # what makes this a real test: with fence matching broken, the
          # phantom reference escapes the block and the run fails.
          fx="$RUNNER_TEMP/ref-fixture-fence"
          rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
          printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
          printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
          printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          {
            printf 'The `demo-critic` agent, `demo-skill` skill.\n'
            printf '```\n~~~\n`phantom-critic`\n```\n'
          } > "$fx/CLAUDE.md"
          REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" || {
            echo "::error::a ~~~ inside a \`\`\` block closed it early — fence marker matching is broken"
            exit 1
          }
          echo "  ok — mismatched fence markers do not close a block"
      - name: Prove a stray CR cannot silently disarm the classifier
        run: |
          # Markdown checks out CRLF on Windows while CI checks out LF, so a
          # \r regression is invisible here unless a CR is injected on purpose.
          #
          # Fixture design matters more than it looks. Appending CR to every
          # line end (`sed 's/$/\r/'`) is TAUTOLOGICAL — measured: the fixture
          # still fails with the \r strip removed, because some awks (notably
          # GNU awk under Git Bash) strip a trailing CR from $0 themselves, and
          # because a Rule-A break fails either way. The CR only bites in one
          # position: between a backtick span and the role word that makes
          # Rule B fire, where the gap class [ \t]* does not match it.
          #
          # So the fixture puts it exactly there, and the assertion greps for
          # the message rather than the exit status. Verified against a mutant
          # with the \r strip deleted: real script exits 1 naming the token,
          # mutant reports "clean".
          fx="$RUNNER_TEMP/ref-fixture-crlf"
          rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
          printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
          printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
          printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          printf 'The `demo-critic` agent, `demo-skill` skill.\nSee **`ghostagent`**\r subagent here.\n' > "$fx/CLAUDE.md"
          if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
            echo "::error::CR-bearing corpus reported clean — the \\r strip is broken"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'unresolved reference' || {
            echo "::error::CR corpus failed for the wrong reason — Rule B did not fire, so the \\r strip is broken"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — Rule B still fires with a CR between the span and the role word"
      - name: Refuse to report a false clean pass on an empty tree
        run: |
          empty="$RUNNER_TEMP/ref-empty"
          rm -rf "$empty"; mkdir -p "$empty"
          printf '# R\n' > "$empty/README.md"
          printf 'nothing here\n' > "$empty/CLAUDE.md"
          if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$empty" 2>&1); then
            echo "::error::empty inventory reported clean instead of failing loudly"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'refusing to report a false clean pass' || {
            echo "::error::empty tree failed, but not via the fail-loud floor"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — empty tree fails loudly"
      - name: Refuse to enumerate untracked files without an explicit opt-in
        run: |
          # The guard that stops `ref-check.sh ~/.claude` printing private
          # agent and skill names out of an untracked tree.
          fx="$RUNNER_TEMP/ref-fixture-optin"
          rm -rf "$fx"; mkdir -p "$fx/agents"
          printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
          printf '# R\n' > "$fx/README.md"
          printf '`demo-critic` agent\n' > "$fx/CLAUDE.md"
          if out=$(sh scripts/ref-check.sh "$fx" 2>&1); then
            echo "::error::non-git tree was enumerated without REF_CHECK_ALLOW_UNTRACKED"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'refusing to enumerate untracked files' || {
            echo "::error::non-git tree failed, but not via the opt-in guard"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — untracked enumeration requires opt-in"
      - name: Prove the fail-loud floors, and two silent classifier fail-opens
        run: |
          # Three more floors guard against a checker that quietly matches
          # nothing: zero backtick tokens extracted at all, zero of those
          # tokens surviving Rule A/B classification, and zero relative
          # README link targets found. Alongside them: two ways a single
          # name or reference can be silently DROPPED rather than flagged —
          # check 3's self-exclusion (a name mentioned only inside its own
          # defining file must still count as unreferenced, or the check
          # falsifies its own point) and the leading-`/` strip (an
          # unresolved `/phantom-skill` reference must surface as
          # `phantom-skill` in the failure message, not vanish past check
          # 2's shape re-validation). Verified against mutants with each
          # mechanism removed: the real script fails, the mutant reports
          # clean.
          fx="$RUNNER_TEMP/ref-fixture-floors"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_fail() { # $1 = message substring, $2 = label
            if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$2: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$1" || {
              echo "::error::$2: expected message not found: $1"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $2"
          }

          # floor — zero backtick tokens extracted at all
          build_good
          printf 'No backtick tokens here at all, plain prose only.\n' > "$fx/CLAUDE.md"
          expect_fail 'zero backtick tokens extracted' 'floor (zero backtick tokens)'

          # floor — tokens exist but none survive Rule A/B classification
          build_good
          printf 'See `foo` and `bar` do their thing, no role words nearby.\n' > "$fx/CLAUDE.md"
          expect_fail 'zero Rule-A/B-selected tokens' 'floor (zero classified tokens)'

          # floor — README has links, but none are relative
          build_good
          printf '# R\n\n[ext](https://example.com) [anchor](#top)\n' > "$fx/README.md"
          expect_fail 'zero relative link targets' 'floor (zero README link targets)'

          # check 3 — a name mentioned ONLY inside its own defining file
          build_good
          printf -- '---\nname: demo-skill\n---\nSelf mention of the `demo-skill` skill here in its own body.\n' > "$fx/skills/demo-skill/SKILL.md"
          printf 'The `demo-critic` agent only, no mention of the skill.\n' > "$fx/CLAUDE.md"
          printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic`\n' > "$fx/README.md"
          expect_fail 'is never referenced' 'check 3 (self-mention does not count)'

          # check 2 — a dangling `/`-prefixed reference must resolve to the
          # STRIPPED name in the message, not silently vanish
          build_good
          printf 'The `demo-critic` agent, `demo-skill` skill, and the `/phantom-skill` skill.\n' > "$fx/CLAUDE.md"
          expect_fail 'unresolved reference `phantom-skill`' 'check 2 (leading-slash strip)'
      - name: Prove the skills arm of check 1 catches what the agents arm catches
        run: |
          # check 1 runs twice — once per agents/*.md against its filename,
          # once per skills/*/SKILL.md against its DIRECTORY name — and
          # every fixture above only ever breaks the agents arm.
          fx="$RUNNER_TEMP/ref-fixture-skills-check1"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_fail() { # $1 = message substring, $2 = label
            if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$2: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$1" || {
              echo "::error::$2: expected message not found: $1"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $2"
          }

          build_good
          printf -- '---\nname: wrong-skill-name\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
          expect_fail 'does not match directory name' 'check 1 skills arm (name vs directory)'

          build_good
          printf -- '---\nname:\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
          expect_fail 'has no (or empty) frontmatter' 'check 1 skills arm (empty name)'
      - name: Prove the git ls-files branch reads tracked files only
        run: |
          # Every fixture above is a plain (non-git) tree, so only the glob
          # fallback gets exercised by a controlled fixture — the git
          # ls-files branch otherwise runs only against this very checkout,
          # which never has a stray untracked agents/*.md lying around to
          # prove the filter with. `git init` + `git add` (no commit — a
          # stock runner has no configured identity, and none is needed:
          # `git ls-files` reads the INDEX, which `add` alone populates)
          # builds a fixture that takes the git branch on purpose.
          gx="$RUNNER_TEMP/ref-fixture-git"
          rm -rf "$gx"; mkdir -p "$gx/agents" "$gx/skills/demo-skill"
          printf -- '---\nname: demo-critic\n---\nbody\n' > "$gx/agents/demo-critic.md"
          printf -- '---\nname: demo-skill\n---\nbody\n' > "$gx/skills/demo-skill/SKILL.md"
          printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$gx/README.md"
          printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$gx/CLAUDE.md"
          ( cd "$gx" && git init -q && git add -A ) >/dev/null 2>&1

          # an UNTRACKED file with frontmatter that would fail check 1 if
          # read — proves the git branch enumerates the index, not the disk
          printf -- '---\nname: totally-broken-name\n---\nbody\n' > "$gx/agents/leaked-secret.md"

          if ! out=$(sh scripts/ref-check.sh "$gx" 2>&1); then
            echo "::error::git-tracked fixture failed — the untracked stray file leaked into the check:"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'ref-check: clean' || {
            echo "::error::git-tracked fixture did not print the clean line"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — untracked stray file is invisible to the git ls-files branch"
      - name: Prove frontmatter and extraction edge cases survive parsing
        run: |
          # BOM strip, quoted-name strip, and fence handling are all
          # "silent success" risks: a fixture that never actually exercises
          # the feature ALSO prints clean. Each positive case below pairs a
          # phantom reference that would only surface if the feature were
          # broken (verified against mutants with each mechanism removed —
          # real script clean, mutant fails), plus two negative cases with
          # distinct messages.
          fx="$RUNNER_TEMP/ref-fixture-parsing"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_clean() { # $1 = label
            if ! out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$1: expected clean but checker failed:"; printf '%s\n' "$out"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF 'ref-check: clean' || {
              echo "::error::$1: did not print the clean line"; printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $1"
          }

          # BOM: a leading UTF-8 BOM on a frontmatter file must not defeat
          # the "line 1 is ---" guard
          build_good
          bom=$(printf '\357\273\277')
          printf '%s---\nname: demo-critic\n---\nbody\n' "$bom" > "$fx/agents/demo-critic.md"
          expect_clean 'BOM-prefixed frontmatter still parses'

          # quoted name: name: "demo-critic" must strip to demo-critic, not
          # fail shape validation on the quote marks themselves
          build_good
          printf -- '---\nname: "demo-critic"\n---\nbody\n' > "$fx/agents/demo-critic.md"
          expect_clean 'quoted frontmatter name strips correctly'

          # a ~~~ fence and an indented ``` fence must both suppress the
          # backtick tokens inside them
          build_good
          printf 'The `demo-critic` agent and the `demo-skill` skill.\n\n~~~\nSee `phantom-agent` agent, not real, inside a tilde fence.\n~~~\n\n    ```\n    Also `ghost-skill` skill inside an indented backtick fence.\n    ```\n' > "$fx/CLAUDE.md"
          expect_clean '~~~ and indented ``` fences both suppress their contents'

          # an unclosed fence must fail loudly, not silently swallow the
          # rest of the file
          build_good
          printf 'The `demo-critic` agent and the `demo-skill` skill.\n\n```\nunclosed fence never ends\n' > "$fx/CLAUDE.md"
          if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
            echo "::error::unclosed fence: checker reported clean but should have failed"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'unclosed fenced code block' || {
            echo "::error::unclosed fence: expected message not found"; printf '%s\n' "$out"; exit 1
          }
          echo "  ok — unclosed fence"

          # an invalid-shape name must be rejected AND never echoed back —
          # the header promises the value itself never appears in output
          build_good
          printf -- '---\nname: XSENTINEL_INVALID_SHAPE_VALUE\n---\nbody\n' > "$fx/agents/demo-critic.md"
          if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
            echo "::error::invalid name shape: checker reported clean but should have failed"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'has an invalid shape' || {
            echo "::error::invalid name shape: expected message not found"; printf '%s\n' "$out"; exit 1
          }
          if printf '%s\n' "$out" | grep -qF 'XSENTINEL_INVALID_SHAPE_VALUE'; then
            echo "::error::invalid name shape: the rejected value was echoed into output — leak risk"
            exit 1
          fi
          echo "  ok — invalid name shape rejected and never echoed"
      - name: Prove README link-target edge cases
        run: |
          fx="$RUNNER_TEMP/ref-fixture-links"

          build_good() {
            rm -rf "$fx"; mkdir -p "$fx/agents" "$fx/skills/demo-skill"
            printf -- '---\nname: demo-critic\n---\nbody\n' > "$fx/agents/demo-critic.md"
            printf -- '---\nname: demo-skill\n---\nbody\n' > "$fx/skills/demo-skill/SKILL.md"
            printf '# R\n\n[c](./agents/demo-critic.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
            printf 'The `demo-critic` agent and the `demo-skill` skill.\n' > "$fx/CLAUDE.md"
          }

          expect_fail() { # $1 = message substring, $2 = label
            if out=$(REF_CHECK_ALLOW_UNTRACKED=1 sh scripts/ref-check.sh "$fx" 2>&1); then
              echo "::error::$2: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$1" || {
              echo "::error::$2: expected message not found: $1"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $2"
          }

          # an absolute link target is rejected outright, distinctly from
          # "does not exist"
          build_good
          printf '# R\n\n[c](./agents/demo-critic.md) [abs](/etc/passwd) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          expect_fail 'is absolute' 'check 4 (absolute link target)'

          # a target containing a `..` path component is likewise rejected
          # outright
          build_good
          printf '# R\n\n[c](./agents/demo-critic.md) [dd](../outside.md) `demo-critic` `demo-skill`\n' > "$fx/README.md"
          expect_fail 'contains a `..` path component' 'check 4 (.. path component)'

          # README.md missing entirely
          build_good
          rm -f "$fx/README.md"
          expect_fail 'README.md not found at repo root' 'check 4 (missing README.md)'
      - name: Prove root-resolution edge cases
        run: |
          # A non-directory root, and no root argument outside a git repo
          # entirely — neither needs REF_CHECK_ALLOW_UNTRACKED, since both
          # fail before that gate is even reached. $RUNNER_TEMP is a
          # sibling of the checkout, not nested inside it, and has no git
          # repo anywhere in its ancestor chain, so the second case is
          # deterministic on a standard GitHub-hosted runner.
          # Note the `if`: GitHub runs steps as `bash -e`, so a bare
          # `out=$(failing-cmd)` aborts the step before the next line runs.
          # Every negative assertion here must keep the substitution inside an
          # `if`/`||` for that reason.
          if out=$(sh scripts/ref-check.sh "$RUNNER_TEMP/ref-does-not-exist-xyz" 2>&1); then
            echo "::error::non-existent root: checker reported clean but should have failed"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'is not a directory' || {
            echo "::error::non-existent root: expected message not found"; printf '%s\n' "$out"; exit 1
          }
          echo "  ok — non-directory root rejected"

          nogit="$RUNNER_TEMP/ref-no-git-dir"
          rm -rf "$nogit"; mkdir -p "$nogit"
          script_abs="$PWD/scripts/ref-check.sh"
          if out=$(cd "$nogit" && sh "$script_abs" 2>&1); then
            echo "::error::no root outside a git repo: checker reported clean but should have failed"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'not inside a git repo' || {
            echo "::error::no root outside a git repo: expected message not found"; printf '%s\n' "$out"; exit 1
          }
          echo "  ok — no root argument outside a git repo rejected"

  version-guard:
    name: version-check.sh (tag ↔ plugin manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove every check can fail, one fixture each
        # Runs on EVERY push and PR, not just tags. The real check below only
        # fires on a tag push, so without these fixtures the script would sit
        # unexercised between releases and first prove itself broken at the one
        # moment it matters. Each assertion greps for THAT check's message
        # rather than the exit status: several of these paths exit 1 for more
        # than one reason, so exit-status-only assertions would let guards be
        # deleted with the job still green (the same measurement that shaped
        # the ref-check job above).
        #
        # Invoked as `sh`, not `bash`, so the POSIX constraint is exercised
        # rather than merely linted.
        run: |
          fx="$RUNNER_TEMP/version-fixture"
          rm -rf "$fx"; mkdir -p "$fx"
          printf '{\n  "name": "x",\n  "version": "1.2.3"\n}\n' > "$fx/good.json"

          expect_clean() { # $1 = tag, $2 = manifest, $3 = label
            if ! out=$(sh scripts/version-check.sh "$1" "$2" 2>&1); then
              echo "::error::$3: expected clean but the checker failed:"; printf '%s\n' "$out"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF 'version-check: clean' || {
              echo "::error::$3: did not print the clean line"; printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $3"
          }

          expect_fail() { # $1 = tag, $2 = manifest, $3 = message substring, $4 = label
            # Note the `if`: steps run as `bash -e`, so a bare
            # `out=$(failing-cmd)` would abort before the assertion below.
            if out=$(sh scripts/version-check.sh "$1" "$2" 2>&1); then
              echo "::error::$4: checker reported clean but should have failed"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF "$3" || {
              echo "::error::$4: expected message not found: $3"
              printf '%s\n' "$out"; exit 1
            }
            echo "  ok — $4"
          }

          expect_clean 'v1.2.3' "$fx/good.json" 'matching tag and manifest pass'

          # a prerelease tag is a first-class case, not a loud failure at the
          # worst possible moment
          printf '{\n  "version": "1.3.0-rc.1"\n}\n' > "$fx/rc.json"
          expect_clean 'v1.3.0-rc.1' "$fx/rc.json" 'prerelease tag accepted'

          expect_fail 'v1.2.4' "$fx/good.json" 'does not match' 'mismatched tag'

          # THE WIRING BUG. `github.ref` is refs/tags/v1.2.3 and `github.ref_name`
          # is v1.2.3; passing the wrong one would fail every release forever, and
          # no bare-tag fixture can catch it. Hence its own message and its own
          # case — deleting the guard makes this fail on shape instead, which is
          # a different string, which is why the assertion greps the message.
          expect_fail 'refs/tags/v1.2.3' "$fx/good.json" 'looks like a full git ref' 'full ref passed instead of ref_name'

          expect_fail '1.2.3' "$fx/good.json" 'has an invalid shape' 'tag missing its v prefix'
          expect_fail 'v1.2.3' "$fx/absent.json" 'not found (run from the repo root' 'missing manifest'

          printf '{\n  "name": "x"\n}\n' > "$fx/nokey.json"
          expect_fail 'v1.2.3' "$fx/nokey.json" 'has no "version" key' 'floor (no version key)'

          printf '{\n  "version": "1.2.3",\n  "dep": { "version": "9.9.9" }\n}\n' > "$fx/twokeys.json"
          expect_fail 'v1.2.3' "$fx/twokeys.json" 'ambiguous, refusing to guess' 'floor (ambiguous version keys)'

          # THE REGRESSION. Same two keys, ONE line — which is what any reflow
          # (`jq -c`, a formatter) produces. Counting matching LINES instead of
          # occurrences made this a silent false clean: `v9.9.9` passed while the
          # top-level version was 1.2.3, and the correct `v1.2.3` was rejected.
          # Both directions are asserted, because the version that fails on the
          # right tag is only half the symptom.
          printf '{"name":"x","version":"1.2.3","dep":{"version":"9.9.9"}}\n' > "$fx/oneline.json"
          expect_fail 'v9.9.9' "$fx/oneline.json" 'ambiguous, refusing to guess' 'regression (single-line nested version, wrong tag)'
          expect_fail 'v1.2.3' "$fx/oneline.json" 'ambiguous, refusing to guess' 'regression (single-line nested version, right tag)'

          printf '{\n  "version": 123\n}\n' > "$fx/unquoted.json"
          expect_fail 'v1.2.3' "$fx/unquoted.json" 'could not extract its value' 'floor (unparseable value)'

          printf '{\n  "version": "not-a-version"\n}\n' > "$fx/junk.json"
          expect_fail 'v1.2.3' "$fx/junk.json" 'version has an invalid shape' 'manifest value rejected on shape'

          # The arity guard exits 2, not 1, so expect_fail's helpers would read
          # it as an ordinary failure — assert it on its own terms.
          for args in '' 'a b c'; do
            # shellcheck disable=SC2086 # deliberate word splitting: '' means no args
            if out=$(sh scripts/version-check.sh $args 2>&1); then
              echo "::error::arity guard: reported clean with [$args]"; exit 1
            fi
            printf '%s\n' "$out" | grep -qF 'usage: version-check.sh' || {
              echo "::error::arity guard: no usage message with [$args]"; printf '%s\n' "$out"; exit 1
            }
          done
          echo "  ok — wrong argument count prints usage"
      - name: The real manifest must stay parseable on every push
        # The default-manifest path is the ONLY path the real check uses, and
        # every fixture above passes an explicit manifest argument — so without
        # this step, default-path resolution and extraction against the real
        # .claude-plugin/plugin.json would first be exercised at release time,
        # where recovery means deleting a pushed tag.
        #
        # Non-tautological, and it never needs updating when the version is
        # bumped: v0.0.0 must NOT match, and it can only reach the comparison at
        # all if the default path resolved and extraction worked. Rename or
        # break the manifest's `version` key and the message becomes a floor
        # message instead, failing here at PR time.
        run: |
          if out=$(sh scripts/version-check.sh v0.0.0 2>&1); then
            echo "::error::v0.0.0 matched the real manifest — that cannot be right"; exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'expected tag `v' || {
            echo "::error::the real manifest never reached the comparison — default-path resolution or extraction is broken"
            printf '%s\n' "$out"; exit 1
          }
          echo "  ok — the real manifest resolves and parses"
      - name: The real tag must agree with the real manifest
        # No step-level `if:`. A wrong condition there makes this a grey no-op
        # while the job still reads green — the "quietly matches nothing exits 0
        # forever" failure, relocated from the script into CI config where no
        # fixture can reach it. Branching inside the body means the step always
        # runs and logs why it did nothing.
        #
        # $GITHUB_REF_NAME is the bare tag (v1.0.0); $GITHUB_REF is the full ref
        # (refs/tags/v1.0.0). Using the built-in env vars rather than a `${{ }}`
        # expansion also keeps the tag name out of the text substituted into the
        # script body before the shell sees it.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              sh scripts/version-check.sh "$GITHUB_REF_NAME"
              ;;
            *)
              echo "  not a tag push ($GITHUB_REF) — the real check is not applicable; the fixtures above are this job"
              ;;
          esac

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint install.ps1 (errors fail; warnings reported)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error, Warning
          if ($results) { $results | Format-Table -AutoSize | Out-String | Write-Host }
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }
